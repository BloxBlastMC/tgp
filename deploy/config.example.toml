# Example tgp-server configuration. Pass with `tgp-server -c /etc/tgp/config.toml`
# (or TGP_CONFIG). Every key can also be set with the environment variable
# shown next to it; the environment wins over the file.

# Root directory for data that has no more specific path below. (TGP_DATA_DIR)
data_dir = "/var/lib/tgp"

[server]
listen = ":3000"                       # TGP_LISTEN
# Public URL users reach tgp on. Used in clone URLs and webhooks.
base_url = "https://git.example.com"   # TGP_BASE_URL
# Honour X-Forwarded-* headers. Enable only behind a reverse proxy. (TGP_TRUST_PROXY)
trust_proxy = true
shutdown_timeout = "30s"

[database]
# "sqlite" for small installs, "postgres" to scale out to multiple server nodes.
driver = "postgres"                                              # TGP_DB_DRIVER
dsn = "postgres://tgp:CHANGE_ME@db:5432/tgp?sslmode=disable"     # TGP_DB_DSN
max_open_conns = 25

[repos]
# Bare repositories live here. Use shared storage (e.g. NFS) when running
# several server nodes. Defaults to <data_dir>/repos. (TGP_REPOS_ROOT)
# root = "/var/lib/tgp/repos"
git_binary = "git"                     # TGP_GIT_BINARY
# Simultaneous clone/fetch/push operations. Extra requests wait up to 30s,
# then get "server busy" (503). 0 = 2 × CPU cores.
max_concurrent_git = 0
# Largest single push accepted, in bytes. Default 2 GiB.
max_push_bytes = 2147483648

[storage]
# Where CI logs, artifacts, caches and release assets go: "local" (a
# directory) or "s3" (any S3-compatible object store: AWS S3, MinIO, Ceph,
# Cloudflare R2, Backblaze B2...). With several server nodes, use s3 or a
# shared directory. The server checks the bucket at startup.
type = "local"                         # TGP_STORAGE_TYPE

[storage.local]
# Defaults to <data_dir>/storage. (TGP_STORAGE_PATH)
# path = "/var/lib/tgp/storage"

[storage.s3]
# Empty endpoint = AWS for the region. The keys need list, get, put and
# delete on the bucket (or prefix).
# endpoint = "https://s3.example.com"  # TGP_S3_ENDPOINT
# region = "us-east-1"                 # TGP_S3_REGION
# bucket = "tgp"                       # TGP_S3_BUCKET
# prefix = ""                          # TGP_S3_PREFIX
# access_key = ""                      # TGP_S3_ACCESS_KEY
# secret_key = ""                      # TGP_S3_SECRET_KEY
# use_path_style = true                # bucket in the path (MinIO and most self-hosted servers)
# insecure = false                     # skip TLS certificate checks

[security]
# 32-byte key that encrypts CI secrets and 2FA seeds. Generated on first
# start if missing. Back it up: without it those secrets can't be decrypted.
# master_key_file = "/var/lib/tgp/master.key"   # TGP_MASTER_KEY_FILE

[log]
level = "info"    # debug | info | warn | error   (TGP_LOG_LEVEL)
format = "text"   # text | json                   (TGP_LOG_FORMAT)
