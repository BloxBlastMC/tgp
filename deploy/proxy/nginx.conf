# nginx in front of tgp-server. Set in tgp's config:
#   [server] base_url = "https://git.example.com", trust_proxy = true
# Certificates here come from certbot; adjust the paths to yours.

server {
    listen 80;
    listen [::]:80;
    server_name git.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name git.example.com;

    ssl_certificate     /etc/letsencrypt/live/git.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/git.example.com/privkey.pem;

    # Pushes, release assets and artifacts can be large; tgp enforces its
    # own limits ([repos] max_push_bytes, release_asset_max_mb...).
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Clients can send this; tgp ignores it, but don't pass it on.
        proxy_set_header True-Client-IP    "";
        proxy_set_header Connection        "";

        # Stream request and response bodies: git pushes and clones, live
        # CI logs (server-sent events) and large downloads.
        proxy_request_buffering off;
        proxy_buffering off;

        # Big clones and pushes, and long-lived log streams.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
