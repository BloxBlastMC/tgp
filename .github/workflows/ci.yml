# GitHub Actions copy of .gitea/workflows/ci.yml. Keep the two in sync.
#
# Gitea only reads .github/workflows when .gitea/workflows is missing, so this
# file is normally ignored there. As a second guard, every job is skipped
# unless it is running on github.com, so the Gitea mirror never runs these
# jobs a second time.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        run: |
          go vet ./...
          test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code -- internal/api/apigen
      - name: Test
        run: go test -race ./...
        env:
          # Set this repo secret to a disposable Postgres database to also
          # run the database tests against Postgres.
          TGP_TEST_POSTGRES_DSN: ${{ secrets.TGP_TEST_POSTGRES_DSN }}

  web:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Generated types are up to date
        run: |
          pnpm run generate
          git diff --exit-code -- src/api/schema.gen.ts
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm test
        working-directory: web

  e2e:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build server with embedded UI
        run: make web build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - name: Browser end-to-end tests
        run: pnpm e2e
        working-directory: web
