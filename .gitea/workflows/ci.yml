name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        run: |
          go vet ./...
          test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code -- internal/api/apigen
      - name: Test
        run: go test -race ./...
        env:
          # Set this repo secret to a disposable Postgres database to also
          # run the database tests against Postgres.
          TGP_TEST_POSTGRES_DSN: ${{ secrets.TGP_TEST_POSTGRES_DSN }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Generated types are up to date
        run: |
          pnpm run generate
          git diff --exit-code -- src/api/schema.gen.ts
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm test
        working-directory: web
