      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchProtectionPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchProtection" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProtection
      tags: [pulls]
      summary: Remove a branch protection rule (admins)
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Error" }

  /pulls:
    get:
      operationId: listMyPulls
      tags: [pulls]
      summary: Pull requests across all repositories you can access
      parameters:
        - name: filter
          in: query
          description: "`review_requested`: waiting for your review. `authored`: opened by you. `all`: every pull request you can see."
          schema: { type: string, enum: [review_requested, authored, all], default: review_requested }
        - $ref: "#/components/parameters/PullStateParam"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Pull requests, most recently updated first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PullPage" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/pulls:
    parameters:
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: listPulls
      tags: [pulls]
      summary: List pull requests, most recently updated first
      parameters:
        - $ref: "#/components/parameters/PullStateParam"
        - { name: author, in: query, description: Username of the author., schema: { type: string } }
        - { name: base, in: query, description: Only pull requests into this branch., schema: { type: string } }
        - { name: head, in: query, description: Only pull requests from this branch., schema: { type: string } }
        - { name: q, in: query, description: Case-insensitive substring of the title., schema: { type: string } }
        - { name: labels, in: query, description: "Comma-separated label names; pull requests must have all of them.", schema: { type: string } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Pull requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PullPage" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createPull
      tags: [pulls]
      summary: Open a pull request (write access)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePullRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PullRequest" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/pulls/{number}:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/PullNumber"
    get:
      operationId: getPull
      tags: [pulls]
      summary: Get a pull request with its mergeability, reviews summary and merge blockers
      responses:
        "200":
          description: Pull request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PullRequest" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updatePull
      tags: [pulls]
      summary: Edit, close, reopen or change the draft state of a pull request
      description: The author or anyone with write access. Changing reviewers needs triage access.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePullRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PullRequest" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/pulls/{number}/commits:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/PullNumber"
    get:
      operationId: listPullCommits
      tags: [pulls]
      summary: Commits in a pull request, oldest first (at most 250)
      responses:
        "200":
          description: Commits
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Commit" } }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/pulls/{number}/files:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/PullNumber"
    get:
      operationId: getPullDiff
      tags: [pulls]
      summary: The pull request's changes (merge base to head)
      responses:
        "200":
          description: Diff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Diff" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/pulls/{number}/timeline:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/PullNumber"
    get:
      operationId: getPullTimeline
      tags: [pulls]
      summary: Conversation timeline, oldest first
      description: |
        Conversation comments, reviews (with the inline comments submitted with
        them), standalone inline comments and events. Replies to inline comments
        aren't separate items; get them from `listPullComments`.
      responses:
        "200":
          description: Timeline
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TimelineItem" } }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/pulls/{number}/comments:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/PullNumber"
    get:
      operationId: listPullComments
      tags: [pulls]
      summary: All comments (conversation and inline, including replies), oldest first
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Comment" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createPullComment
      tags: [pulls]
      summary: Comment on a pull request (triage access)
      description: |
        Without `path`, a conversation comment. With `path` and `line`, an inline
        comment on a line of the diff (`side: new` for the head version, `old`
        for the base version). With `reply_to`, a reply in an inline thread.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateComment" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/comments/{id}:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      operationId: updateComment
      tags: [pulls]
      summary: Edit a comment (its author) or resolve an inline thread (triage access)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string }
                resolved: { type: boolean, description: Resolve or unresolve the thread this comment starts. }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteComment
      tags: [pulls]
      summary: Delete a comment (its author or an admin)
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/pulls/{number}/reviews:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/PullNumber"
    get:
      operationId: listReviews
      tags: [pulls]
      summary: Reviews, oldest first
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Review" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createReview
      tags: [pulls]
      summary: Submit a review (triage access)
      description: |
        Testers and maintainers can approve or request changes; the author can
        only comment. Inline comments are submitted together with the review.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReview" }
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/pulls/{number}/reviews/{id}/dismiss:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/PullNumber"
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: dismissReview
      tags: [pulls]
      summary: Dismiss an approval or change request (write access)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        "200":
          description: Dismissed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/pulls/{number}/merge:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/PullNumber"
    post:
      operationId: mergePull
      tags: [pulls]
      summary: Merge a pull request (write access)
      description: |
        Fails with `conflict` (and `details.blockers`) when the pull request
        can't be merged; `getPull` lists the blockers in advance.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MergePullRequest" }
      responses:
        "200":
          description: Merged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PullRequest" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/pulls/{number}/update-branch:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/PullNumber"
    post:
      operationId: updatePullBranch
      tags: [pulls]
      summary: Merge the base branch into the head branch (write access)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sha: { type: string, description: Only update if the head is still at this commit. }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PullRequest" }
        default: { $ref: "#/components/responses/Error" }

  /issues:
    get:
      operationId: listMyIssues
      tags: [issues]
      summary: Issues across all repositories you can access
      parameters:
        - name: filter
          in: query
          description: "`assigned`: assigned to you. `created`: opened by you. `all`: every issue you can see."
          schema: { type: string, enum: [assigned, created, all], default: assigned }
        - $ref: "#/components/parameters/IssueStateParam"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Issues, most recently updated first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuePage" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/issues:
    parameters:
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: listIssues
      tags: [issues]
      summary: List issues (not pull requests)
      parameters:
        - $ref: "#/components/parameters/IssueStateParam"
        - { name: labels, in: query, description: "Comma-separated label names; issues must have all of them.", schema: { type: string } }
        - { name: milestone, in: query, description: "Milestone title, `none` (no milestone) or `*` (any milestone).", schema: { type: string } }
        - { name: assignee, in: query, description: "Username, `none` or `*`.", schema: { type: string } }
        - { name: author, in: query, description: Username of the author., schema: { type: string } }
        - { name: q, in: query, description: Case-insensitive substring of the title., schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [updated, created, comments], default: updated } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Issues
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuePage" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createIssue
      tags: [issues]
      summary: Open an issue (triage access, so testers can file bugs)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIssue" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/issues/{number}:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/IssueNumber"
    get:
      operationId: getIssue
      tags: [issues]
      summary: Get an issue
      description: For a pull request's number this fails with `not_found` and `details.is_pull = true`.
      responses:
        "200":
          description: Issue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateIssue
      tags: [issues]
      summary: Edit, close or reopen an issue, or change its labels, assignees and milestone
      description: |
        Title and body: the author or write access. Everything else: triage access.
        `labels`/`assignees` replace the lists; `add_*`/`remove_*` change them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateIssue" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/issues/{number}/timeline:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/IssueNumber"
    get:
      operationId: getIssueTimeline
      tags: [issues]
      summary: Comments and events, oldest first
      responses:
        "200":
          description: Timeline
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TimelineItem" } }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/issues/{number}/comments:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/IssueNumber"
    get:
      operationId: listIssueComments
      tags: [issues]
      summary: Comments, oldest first
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Comment" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createIssueComment
      tags: [issues]
      summary: Comment on an issue (triage access)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/labels:
    parameters:
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: listLabels
      tags: [issues]
      summary: List labels, by name
      responses:
        "200":
          description: Labels
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Label" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createLabel
      tags: [issues]
      summary: Create a label (write access)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabelInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/labels/{id}:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      operationId: updateLabel
      tags: [issues]
      summary: Rename or recolour a label (write access)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabelPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Label" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteLabel
      tags: [issues]
      summary: Delete a label, removing it from issues and pull requests (write access)
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/milestones:
    parameters:
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: listMilestones
      tags: [issues]
      summary: List milestones (open ones by due date, then closed)
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [open, closed, all], default: open } }
      responses:
        "200":
          description: Milestones
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Milestone" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createMilestone
      tags: [issues]
      summary: Create a milestone (write access)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MilestoneInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Milestone" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/milestones/{id}:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getMilestone
      tags: [issues]
      summary: Get a milestone
      responses:
        "200":
          description: Milestone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Milestone" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMilestone
      tags: [issues]
      summary: Edit, close or reopen a milestone (write access)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MilestonePatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Milestone" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMilestone
      tags: [issues]
      summary: Delete a milestone; its issues and pull requests keep existing without it (write access)
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /runs:
    get:
      operationId: listAllRuns
      tags: [ci]
      summary: Recent workflow runs across every repository you can read
      parameters:
        - $ref: "#/components/parameters/RunStatusParam"
        - { name: actor, in: query, description: "Username, or `@me`.", schema: { type: string } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Runs, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunPage" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/runs:
    parameters:
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: listRuns
      tags: [ci]
      summary: List a repository's workflow runs
      parameters:
        - { name: workflow, in: query, description: "Workflow file name (e.g. `ci.yml`) or path.", schema: { type: string } }
        - { name: branch, in: query, schema: { type: string } }
        - { name: event, in: query, schema: { $ref: "#/components/schemas/RunEvent" } }
        - $ref: "#/components/parameters/RunStatusParam"
        - { name: actor, in: query, description: "Username, or `@me`.", schema: { type: string } }
        - { name: pull, in: query, description: Pull request number., schema: { type: integer, format: int64 } }
        - { name: sha, in: query, description: Full or abbreviated head commit., schema: { type: string } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Runs, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunPage" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/runs/{number}:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/RunNumber"
    get:
      operationId: getRun
      tags: [ci]
      summary: Get a run with its jobs and steps
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowRunDetail" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/runs/{number}/cancel:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/RunNumber"
    post:
      operationId: cancelRun
      tags: [ci]
      summary: Cancel a run (write access)
      description: Queued jobs are cancelled immediately; running jobs are stopped by their runner. Fails with `conflict` if the run already finished.
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowRunDetail" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/runs/{number}/rerun:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/RunNumber"
    post:
      operationId: rerunRun
      tags: [ci]
      summary: Re-run a finished run (triage access, so testers can re-run)
      description: Starts a new attempt of the same run, with the same commit, workflow file and inputs. With `failed_only`, jobs that succeeded keep their results and only failed or cancelled jobs (and the jobs that depend on them) run again.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RerunRequest" }
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowRunDetail" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/jobs/{id}:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/JobID"
    get:
      operationId: getJob
      tags: [ci]
      summary: Get a job with its steps
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/jobs/{id}/rerun:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/JobID"
    post:
      operationId: rerunJob
      tags: [ci]
      summary: Re-run one job and the jobs that depend on it (triage access)
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowRunDetail" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/jobs/{id}/logs:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/JobID"
    get:
      operationId: getJobLogs
      tags: [ci]
      summary: Read a job's log
      description: |
        Returns log lines after the `after` cursor (0 for the start). Poll with the
        returned `next` until `complete` is true to follow a running job, or use
        `GET /repos/{repo}/jobs/{id}/logs/stream` (server-sent events: `line` events
        carry a `LogLine`, a final `end` event carries the job).
      parameters:
        - { name: after, in: query, description: Return lines numbered above this., schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20000, default: 5000 } }
        - { name: step, in: query, description: Only lines of this step number., schema: { type: integer } }
      responses:
        "200":
          description: Log lines
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobLogs" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/workflows:
    parameters:
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: listWorkflows
      tags: [ci]
      summary: List the workflow files at a ref, with validation errors
      parameters:
        - $ref: "#/components/parameters/RefParam"
      responses:
        "200":
          description: Workflows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Workflow" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/workflows/{workflow}/dispatch:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - { name: workflow, in: path, required: true, description: "Workflow file name, e.g. `deploy.yml`.", schema: { type: string } }
    post:
      operationId: dispatchWorkflow
      tags: [ci]
      summary: Run a workflow manually (write access)
      description: The workflow must have a `workflow_dispatch` trigger. Inputs are checked against its declared inputs.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DispatchRequest" }
      responses:
        "201":
          description: The new run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkflowRunDetail" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/commits/{sha}/checks:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - { name: sha, in: path, required: true, description: Commit, branch or tag., schema: { type: string } }
    get:
      operationId: getCommitChecks
      tags: [ci]
      summary: CI results for a commit (latest attempt of each job)
      responses:
        "200":
          description: Checks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckSummary" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/secrets:
    parameters:
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: listRepoSecrets
      tags: [ci]
      summary: List repository secrets (write access; values are never returned)
      responses:
        "200":
          description: Secrets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Secret" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/secrets/{name}:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/SecretName"
    put:
      operationId: setRepoSecret
      tags: [ci]
      summary: Create or update a repository secret (write access)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretValue" }
      responses:
        "200":
          description: Secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteRepoSecret
      tags: [ci]
      summary: Delete a repository secret (write access)
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /admin/secrets:
    get:
      operationId: listOrgSecrets
      tags: [admin, ci]
      summary: List organisation secrets, available to every repository (admin)
      responses:
        "200":
          description: Secrets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Secret" }
        default: { $ref: "#/components/responses/Error" }

  /admin/secrets/{name}:
    parameters:
      - $ref: "#/components/parameters/SecretName"
    put:
      operationId: setOrgSecret
      tags: [admin, ci]
      summary: Create or update an organisation secret (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretValue" }
      responses:
        "200":
          description: Secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Secret" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteOrgSecret
      tags: [admin, ci]
      summary: Delete an organisation secret (admin)
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /admin/runners:
    get:
      operationId: listRunners
      tags: [admin, ci]
      summary: List runners with their status, load and running jobs (admin)
      responses:
        "200":
          description: Runners
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunnerList" }
        default: { $ref: "#/components/responses/Error" }

  /admin/runners/registration-tokens:
    post:
      operationId: createRunnerToken
      tags: [admin, ci]
      summary: Create a one-time runner registration token (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_in_hours: { type: integer, minimum: 1, maximum: 720, default: 24 }
      responses:
        "201":
          description: The token. It is shown only once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunnerRegistrationToken" }
        default: { $ref: "#/components/responses/Error" }

  /admin/runners/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getRunner
      tags: [admin, ci]
      summary: Get a runner (admin)
      responses:
        "200":
          description: Runner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Runner" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateRunner
      tags: [admin, ci]
      summary: Disable, enable or rename a runner (admin)
      description: A disabled runner finishes the jobs it has but gets no new ones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                disabled: { type: boolean }
                name: { type: string }
      responses:
        "200":
          description: Runner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Runner" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteRunner
      tags: [admin, ci]
      summary: Remove a runner (admin)
      description: Its credentials stop working; jobs it was running fail.
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Error" }

  /admin/ci/settings:
    get:
      operationId: getCISettings
      tags: [admin, ci]
      summary: CI resource limits and defaults (admin)
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CISettings" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateCISettings
      tags: [admin, ci]
      summary: Change CI resource limits and defaults (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CISettingsPatch" }
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CISettings" }
        default: { $ref: "#/components/responses/Error" }

  /admin/health:
    get:
      operationId: getServerHealth
      tags: [admin]
      summary: Server health, resource use and queue lengths (admin)
      description: |
        Checks the database, blob storage and disks, and reports queue
        lengths and storage use per repository. Repository sizes on disk are
        measured at most every 5 minutes unless `refresh` is set.
      parameters:
        - name: refresh
          in: query
          required: false
          description: Measure repository sizes on disk now instead of using the cached figures.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Health report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerHealth" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/runs/{number}/artifacts:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/RunNumber"
    get:
      operationId: listRunArtifacts
      tags: [ci]
      summary: List a run's artifacts
      description: Artifacts uploaded by every attempt of the run that haven't expired, newest first.
      responses:
        "200":
          description: Artifacts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Artifact" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/artifacts:
    parameters:
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: listArtifacts
      tags: [ci]
      summary: List a repository's artifacts
      parameters:
        - { name: name, in: query, description: Only artifacts with this name., schema: { type: string } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Artifacts, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactPage" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/artifacts/{id}:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/ArtifactID"
    get:
      operationId: getArtifact
      tags: [ci]
      summary: Get an artifact
      responses:
        "200":
          description: Artifact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteArtifact
      tags: [ci]
      summary: Delete an artifact (write access)
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/artifacts/{id}/zip:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/ArtifactID"
    get:
      operationId: downloadArtifact
      tags: [ci]
      summary: Download an artifact as a zip file
      responses:
        "200":
          description: Zip archive of the artifact's files
          content:
            application/zip:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/caches:
    parameters:
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: listCaches
      tags: [ci]
      summary: List a repository's CI caches
      parameters:
        - { name: key, in: query, description: Only caches whose key starts with this., schema: { type: string } }
        - { name: ref, in: query, description: "Only caches saved from this ref (e.g. `refs/heads/main`).", schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [last_used, created, size], default: last_used } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Caches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CachePage" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteCaches
      tags: [ci]
      summary: Delete caches by key (write access)
      description: Deletes every cache with exactly this key (optionally only for one ref). Without key, deletes all of the repository's caches.
      parameters:
        - { name: key, in: query, schema: { type: string } }
        - { name: ref, in: query, schema: { type: string } }
      responses:
        "200":
          description: Number deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeletedCount" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/caches/{id}:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      operationId: deleteCache
      tags: [ci]
      summary: Delete one cache (write access)
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/archive:
    parameters:
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: getArchive
      tags: [code]
      summary: Download the source code at a ref as an archive
      parameters:
        - { name: ref, in: query, required: true, description: Branch, tag or commit., schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [zip, tar.gz], default: tar.gz } }
      responses:
        "200":
          description: Archive with every file under a `<repo>-<ref>/` directory
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/releases:
    parameters:
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: listReleases
      tags: [releases]
      summary: List releases, newest first
      description: Drafts are only listed for users with write access.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Releases
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleasePage" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createRelease
      tags: [releases]
      summary: Create a release (write access)
      description: If the tag doesn't exist it's created at `target` (a branch or commit; default the default branch) when the release is published. Drafts don't create tags.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRelease" }
      responses:
        "201":
          description: Release
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Release" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/releases/latest:
    parameters:
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: getLatestRelease
      tags: [releases]
      summary: The newest published release that isn't a prerelease
      responses:
        "200":
          description: Release
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Release" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/releases/tags/{tag}:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - { name: tag, in: path, required: true, description: "Tag name (URL-encode `/`).", schema: { type: string } }
    get:
      operationId: getReleaseByTag
      tags: [releases]
      summary: Get a release by its tag
      responses:
        "200":
          description: Release
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Release" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/releases/{id}:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/ReleaseID"
    get:
      operationId: getRelease
      tags: [releases]
      summary: Get a release
      responses:
        "200":
          description: Release
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Release" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateRelease
      tags: [releases]
      summary: Edit or publish a release (write access)
      description: Setting `draft` to false publishes the release, creating its tag if needed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRelease" }
      responses:
        "200":
          description: Release
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Release" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteRelease
      tags: [releases]
      summary: Delete a release and its assets (write access)
      description: The tag stays unless `delete_tag` is set.
      parameters:
        - { name: delete_tag, in: query, schema: { type: boolean, default: false } }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/releases/{id}/assets:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/ReleaseID"
    post:
      operationId: uploadReleaseAsset
      tags: [releases]
      summary: Upload a file to a release (write access)
      description: The request body is the raw file. The size limit is the admin's `release_asset_max_mb` setting.
      parameters:
        - { name: name, in: query, required: true, description: File name shown on the release., schema: { type: string } }
        - { name: label, in: query, description: Optional display label., schema: { type: string } }
        - { name: overwrite, in: query, description: Replace an existing asset with the same name., schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Asset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleaseAsset" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/releases/{id}/assets/{asset_id}:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/ReleaseID"
      - { name: asset_id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: downloadReleaseAsset
      tags: [releases]
      summary: Download a release asset
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteReleaseAsset
      tags: [releases]
      summary: Delete a release asset (write access)
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /webhook-events:
    get:
      operationId: listWebhookEvents
      tags: [webhooks]
      summary: Events webhooks can subscribe to, with their actions
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WebhookEventInfo" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/webhooks:
    parameters:
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: listRepoWebhooks
      tags: [webhooks]
      summary: List a repository's webhooks (write access)
      responses:
        "200":
          description: Webhooks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Webhook" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createRepoWebhook
      tags: [webhooks]
      summary: Add a webhook to a repository (write access)
      description: A `ping` event is sent right away.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookInput" }
      responses:
        "201":
          description: Webhook
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        default: { $ref: "#/components/responses/Error" }

  /admin/webhooks:
    get:
      operationId: listOrgWebhooks
      tags: [webhooks, admin]
      summary: List organisation webhooks, which get events from every repository (admin)
      responses:
        "200":
          description: Webhooks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Webhook" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createOrgWebhook
      tags: [webhooks, admin]
      summary: Add an organisation webhook (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookInput" }
      responses:
        "201":
          description: Webhook
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        default: { $ref: "#/components/responses/Error" }

  /webhooks/{id}:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
    get:
      operationId: getWebhook
      tags: [webhooks]
      summary: Get a webhook (write access to its repository; admin for organisation webhooks)
      responses:
        "200":
          description: Webhook
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateWebhook
      tags: [webhooks]
      summary: Change a webhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookPatch" }
      responses:
        "200":
          description: Webhook
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteWebhook
      tags: [webhooks]
      summary: Delete a webhook and its delivery log
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /webhooks/{id}/ping:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
    post:
      operationId: pingWebhook
      tags: [webhooks]
      summary: Send a ping event now
      description: Waits up to the delivery timeout and returns the delivery with its result.
      responses:
        "200":
          description: Delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDelivery" }
        default: { $ref: "#/components/responses/Error" }

  /webhooks/{id}/deliveries:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
    get:
      operationId: listWebhookDeliveries
      tags: [webhooks]
      summary: Recent deliveries, newest first (kept for 30 days)
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/WebhookDeliveryStatus" } }
        - { name: event, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDeliveryPage" }
        default: { $ref: "#/components/responses/Error" }

  /webhooks/{id}/deliveries/{delivery}:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
      - $ref: "#/components/parameters/DeliveryID"
    get:
      operationId: getWebhookDelivery
      tags: [webhooks]
      summary: A delivery with its request and response
      responses:
        "200":
          description: Delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDeliveryDetail" }
        default: { $ref: "#/components/responses/Error" }

  /webhooks/{id}/deliveries/{delivery}/redeliver:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
      - $ref: "#/components/parameters/DeliveryID"
    post:
      operationId: redeliverWebhookDelivery
      tags: [webhooks]
      summary: Send a delivery's payload again, as a new delivery
      responses:
        "201":
          description: The new delivery (queued)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookDelivery" }
        default: { $ref: "#/components/responses/Error" }

components:
  parameters:
    WebhookID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    DeliveryID:
      name: delivery
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ArtifactID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ReleaseID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    RepoName:
      name: repo
      in: path
      required: true
      description: Repository name (case-insensitive).
      schema: { type: string }
    RefParam:
      name: ref
      in: query
      description: Branch, tag or commit. Defaults to the default branch.
      schema: { type: string }
    PathParam:
      name: path
      in: query
      description: Path inside the repository; empty for the root.
      schema: { type: string }
    RequiredPathParam:
      name: path
      in: query
      required: true
      description: Path of a file inside the repository.
      schema: { type: string }
    PullNumber:
      name: number
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PullStateParam:
      name: state
      in: query
      schema: { type: string, enum: [open, closed, merged, all], default: open }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    IssueNumber:
      name: number
      in: path
      required: true
      schema: { type: integer, format: int64 }
    IssueStateParam:
      name: state
      in: query
      schema: { type: string, enum: [open, closed, all], default: open }
    RunNumber:
      name: number
      in: path
      required: true
      schema: { type: integer, format: int64 }
    JobID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    SecretName:
      name: name
      in: path
      required: true
      description: "Letters, digits and _; not starting with a digit or TGP_/GITHUB_. Case-insensitive (stored upper-case)."
      schema: { type: string }
    RunStatusParam:
      name: status
      in: query
      description: "A status, a conclusion, or `active` (not completed)."
      schema: { type: string, enum: [active, waiting, queued, in_progress, completed, success, failure, cancelled, skipped, timed_out] }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: tgp_session
    bearerToken:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              example: not_found
            message:
              type: string
              description: Human readable message.
            details:
              type: object
              additionalProperties: true
              description: Optional structured details (e.g. per-field validation errors).

    Meta:
      type: object
      required: [version, commit, setup_required, org_name, has_logo]
      properties:
        version: { type: string, example: 1.0.0 }
        commit: { type: string }
        setup_required:
          type: boolean
          description: True until the first admin and org have been configured.
        org_name:
          type: string
          description: Org display name; empty before setup.
        has_logo: { type: boolean }

    Role:
      type: string
      enum: [admin, maintainer, tester]
      description: |
        `admin`: everything, including the admin panel and creating repositories.
        `maintainer`: read/write on granted repositories.
        `tester`: read, issues, comments, reviews and CI re-runs on granted repositories.

    UserSummary:
      type: object
      required: [id, username, display_name, role]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    User:
      type: object
      required: [id, username, display_name, email, role, all_repos, must_change_password, totp_enabled, disabled, created_at]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        display_name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        all_repos:
          type: boolean
          description: Access to every repository. When false, access is limited to explicitly granted repositories. Always true for admins.
        must_change_password: { type: boolean }
        temp_password_expires_at: { type: string, format: date-time, nullable: true }
        totp_enabled: { type: boolean }
        disabled: { type: boolean }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    UserWithTempPassword:
      type: object
      required: [user, temp_password, temp_password_expires_at]
      properties:
        user: { $ref: "#/components/schemas/User" }
        temp_password:
          type: string
          description: Shown only once. The user must change it at first login.
        temp_password_expires_at: { type: string, format: date-time }

    CreateUserRequest:
      type: object
      required: [username, role]
      properties:
        username:
          type: string
          description: Lowercase letters, digits, `-`, `_` and `.`; 1-39 characters, starting with a letter or digit.
        display_name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        all_repos:
          type: boolean
          default: false
          description: Give access to every repository (ignored for admins, who always have it).

    UpdateUserRequest:
      type: object
      properties:
        display_name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        all_repos: { type: boolean }
        disabled:
          type: boolean
          description: Disabled users can't log in and their sessions and tokens stop working.

    Session:
      type: object
      required: [user, auth_method, must_change_password]
      properties:
        user: { $ref: "#/components/schemas/User" }
        auth_method:
          type: string
          enum: [session, token]
        must_change_password: { type: boolean }
        token_scopes:
          type: array
          items: { type: string }
          description: Present when authenticated with a token.

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Username or email.
        password: { type: string }
        totp_code: { type: string }
        recovery_code: { type: string }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password:
          type: string
          description: At least 10 characters.

    PasswordConfirm:
      type: object
      required: [password]
      properties:
        password: { type: string }

    TotpSetup:
      type: object
      required: [secret, otpauth_url]
      properties:
        secret:
          type: string
          description: Base32 secret for manual entry.
        otpauth_url:
          type: string
          description: "`otpauth://` URL to render as a QR code."

    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          items: { type: string }
          description: Single-use codes for logging in without the authenticator. Shown only once.

    TokenScope:
      type: string
      enum: [read, write, admin]

    AccessToken:
      type: object
      required: [id, name, prefix, scopes, created_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        prefix:
          type: string
          description: First characters of the token, to recognise it.
        scopes:
          type: array
          items: { $ref: "#/components/schemas/TokenScope" }
        last_used_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    CreateTokenRequest:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, example: laptop CLI }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/TokenScope" }
          minItems: 1
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: Omit for a token that never expires.

    CreatedToken:
      type: object
      required: [token, access_token]
      properties:
        token:
          type: string
          description: The secret. Shown only once.
        access_token: { $ref: "#/components/schemas/AccessToken" }

    Org:
      type: object
      required: [name, description, base_url, has_logo]
      properties:
        name: { type: string }
        description: { type: string }
        base_url:
          type: string
          description: Public URL of this server, used in clone URLs and webhooks.
        has_logo: { type: boolean }

    UpdateOrgRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        base_url: { type: string }

    SetupRequest:
      type: object
      required: [setup_token, admin, org]
      properties:
        setup_token:
          type: string
          description: One-time token printed in the tgp-server log on first start.
        admin:
          type: object
          required: [username, password]
          properties:
            username: { type: string }
            display_name: { type: string }
            email: { type: string }
            password: { type: string }
        org:
          type: object
          required: [name]
          properties:
            name: { type: string }
            description: { type: string }
            base_url: { type: string }
        users:
          type: array
          description: Optional extra users; each gets a temporary password.
          items: { $ref: "#/components/schemas/CreateUserRequest" }

    SetupResponse:
      type: object
      required: [admin, users]
      properties:
        admin: { $ref: "#/components/schemas/User" }
        users:
          type: array
          items: { $ref: "#/components/schemas/UserWithTempPassword" }

    AuditEntry:
      type: object
      required: [id, actor, action, target_type, target, ip, details, created_at]
      properties:
        id: { type: integer, format: int64 }
        actor:
          type: string
          description: Username of whoever did it; empty for anonymous actions such as failed logins.
        action:
          type: string
          example: user.create
        target_type: { type: string, example: user }
        target: { type: string }
        ip: { type: string }
        details:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }

    AuditPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        next_before:
          type: integer
          format: int64
          nullable: true
          description: Pass as `before` to get the next page; absent on the last page.

    Permission:
      type: string
      enum: [none, read, triage, write, admin]
      description: |
        `read`: clone and browse. `triage` (testers): plus issues, comments, reviews, CI re-runs.
        `write` (maintainers): plus push and merge. `admin`: plus rename, archive, delete, access.

    Repo:
      type: object
      required: [id, name, description, default_branch, empty, archived, clone_url, permission, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        default_branch: { type: string }
        empty: { type: boolean, description: True until the first push. }
        archived: { type: boolean, description: Archived repositories are read-only. }
        clone_url: { type: string, example: "https://git.example.com/game.git" }
        permission: { $ref: "#/components/schemas/Permission" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        pushed_at: { type: string, format: date-time, nullable: true }

    CreateRepoRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        default_branch: { type: string, default: main }
        auto_init: { type: boolean, default: false, description: Create an initial commit with a README. }

    UpdateRepoRequest:
      type: object
      properties:
        name: { type: string, description: Rename (admins). The old clone URL stops working. }
        description: { type: string }
        default_branch: { type: string, description: Must be an existing branch. }
        archived: { type: boolean, description: Archive or unarchive (admins). }

    RepoAccess:
      type: object
      required: [user, permission, source]
      properties:
        user: { $ref: "#/components/schemas/UserSummary" }
        permission: { $ref: "#/components/schemas/Permission" }
        source:
          type: string
          enum: [admin, all_repos, grant]
          description: Why the user has access.

    UserRepoAccess:
      type: object
      required: [all_repos, repos]
      properties:
        all_repos: { type: boolean }
        repos: { type: array, items: { type: string }, description: Explicitly granted repository names. }

    Ref:
      type: object
      required: [name, commit, subject, author, date]
      properties:
        name: { type: string }
        commit: { type: string, description: Commit id the ref points to (tags are peeled). }
        subject: { type: string, description: First line of the commit message. }
        author: { type: string }
        date: { type: string, format: date-time }
        is_default: { type: boolean }
        protected: { type: boolean, description: A branch protection rule applies (branches only). }

    TreeEntry:
      type: object
      required: [name, path, type, mode, sha, size]
      properties:
        name: { type: string }
        path: { type: string }
        type: { type: string, enum: [file, dir, symlink, submodule] }
        mode: { type: string }
        sha: { type: string }
        size: { type: integer, format: int64 }

    Tree:
      type: object
      required: [ref, commit, path, entries]
      properties:
        ref: { type: string }
        commit: { type: string }
        path: { type: string }
        entries: { type: array, items: { $ref: "#/components/schemas/TreeEntry" } }

    Blob:
      type: object
      required: [ref, commit, path, sha, size, binary, truncated, encoding, content]
      properties:
        ref: { type: string }
        commit: { type: string }
        path: { type: string }
        sha: { type: string }
        size: { type: integer, format: int64 }
        binary: { type: boolean }
        truncated: { type: boolean, description: Content was cut at 1 MiB. }
        encoding: { type: string, enum: [utf-8, base64] }
        content: { type: string }

    Readme:
      type: object
      required: [path, html]
      properties:
        path: { type: string }
        html: { type: string, description: Sanitised HTML. }

    Signature:
      type: object
      required: [name, email, date]
      properties:
        name: { type: string }
        email: { type: string }
        date: { type: string, format: date-time }

    Commit:
      type: object
      required: [sha, parents, author, committer, subject, body]
      properties:
        sha: { type: string }
        parents: { type: array, items: { type: string } }
        author: { $ref: "#/components/schemas/Signature" }
        committer: { $ref: "#/components/schemas/Signature" }
        subject: { type: string }
        body: { type: string }

    CommitPage:
      type: object
      required: [commits, has_more]
      properties:
        commits: { type: array, items: { $ref: "#/components/schemas/Commit" } }
        has_more: { type: boolean }

    DiffLine:
      type: object
      required: [type, content]
      properties:
        type: { type: string, enum: [context, add, del] }
        content: { type: string }
        old_line: { type: integer, description: Line number in the old file (absent for added lines). }
        new_line: { type: integer, description: Line number in the new file (absent for deleted lines). }
        no_newline: { type: boolean }

    DiffHunk:
      type: object
      required: [header, old_start, old_lines, new_start, new_lines, lines]
      properties:
        header: { type: string }
        old_start: { type: integer }
        old_lines: { type: integer }
        new_start: { type: integer }
        new_lines: { type: integer }
        section: { type: string }
        lines: { type: array, items: { $ref: "#/components/schemas/DiffLine" } }

    DiffFile:
      type: object
      required: [old_path, new_path, status, binary, additions, deletions, hunks, truncated]
      properties:
        old_path: { type: string }
        new_path: { type: string }
        status: { type: string, enum: [added, deleted, modified, renamed, copied] }
        old_mode: { type: string }
        new_mode: { type: string }
        binary: { type: boolean }
        additions: { type: integer }
        deletions: { type: integer }
        hunks: { type: array, items: { $ref: "#/components/schemas/DiffHunk" } }
        truncated: { type: boolean, description: Some hunks were omitted because the diff is too large. }

    Diff:
      type: object
      required: [files, additions, deletions, truncated]
      properties:
        files: { type: array, items: { $ref: "#/components/schemas/DiffFile" } }
        additions: { type: integer }
        deletions: { type: integer }
        truncated: { type: boolean }

    CommitDetail:
      type: object
      required: [commit, diff]
      properties:
        commit: { $ref: "#/components/schemas/Commit" }
        diff: { $ref: "#/components/schemas/Diff" }

    BlameRange:
      type: object
      required: [commit, author, email, date, summary, start_line, lines]
      properties:
        commit: { type: string }
        author: { type: string }
        email: { type: string }
        date: { type: string, format: date-time }
        summary: { type: string }
        start_line: { type: integer }
        lines: { type: array, items: { type: string } }

    Blame:
      type: object
      required: [ref, commit, path, ranges]
      properties:
        ref: { type: string }
        commit: { type: string }
        path: { type: string }
        ranges: { type: array, items: { $ref: "#/components/schemas/BlameRange" } }

    PullState:
      type: string
      enum: [open, closed, merged]

    MergeMethod:
      type: string
      enum: [merge, squash, rebase]
      description: |
        `merge`: a merge commit. `squash`: one commit with all the changes.
        `rebase`: each commit replayed onto the base (fast-forward when possible).

    ReviewDecision:
      type: string
      enum: [approved, changes_requested, review_required, none]
      description: |
        `approved`: enough approvals (or at least one when no rule requires any).
        `changes_requested`: someone's latest review requests changes.
        `review_required`: a protection rule needs more approvals. `none`: no reviews yet.

    PullSummary:
      type: object
      required: [number, repo, title, state, draft, author, head_branch, base_branch, comments, review_decision, requested_reviewers, labels, assignees, created_at, updated_at]
      properties:
        number: { type: integer, format: int64 }
        repo: { type: string, description: Repository name. }
        title: { type: string }
        state: { $ref: "#/components/schemas/PullState" }
        draft: { type: boolean }
        author: { $ref: "#/components/schemas/UserSummary" }
        head_branch: { type: string }
        base_branch: { type: string }
        comments: { type: integer }
        review_decision: { $ref: "#/components/schemas/ReviewDecision" }
        requested_reviewers: { type: array, items: { $ref: "#/components/schemas/UserSummary" } }
        labels: { type: array, items: { $ref: "#/components/schemas/Label" } }
        assignees: { type: array, items: { $ref: "#/components/schemas/UserSummary" } }
        milestone:
          allOf: [{ $ref: "#/components/schemas/MilestoneRef" }]
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        merged_at: { type: string, format: date-time, nullable: true }

    PullPage:
      type: object
      required: [pulls, total]
      properties:
        pulls: { type: array, items: { $ref: "#/components/schemas/PullSummary" } }
        total: { type: integer, description: Total matching, across all pages. }

    PullBranch:
      type: object
      required: [branch, sha, exists]
      properties:
        branch: { type: string }
        sha: { type: string, description: Current tip (for a merged pull request, the commit it was merged at). }
        exists: { type: boolean, description: The branch still exists. }

    MergeBlocker:
      type: object
      required: [code, message, bypassable]
      properties:
        code:
          type: string
          enum: [closed, merged, draft, head_missing, base_missing, conflict, permission, approvals, changes_requested, behind, checks]
        message: { type: string }
        bypassable:
          type: boolean
          description: An admin may merge anyway with `bypass_protection` (the rule allows admins to bypass it).

    ReviewerState:
      type: object
      required: [user, state, stale]
      properties:
        user: { $ref: "#/components/schemas/UserSummary" }
        state: { type: string, enum: [approved, changes_requested, commented, dismissed, requested] }
        commit_sha: { type: string }
        stale: { type: boolean, description: Reviewed an older head commit. }

    PullRequest:
      type: object
      required: [number, repo, title, body, body_html, state, draft, author, head, base, merge_base, commits, additions, deletions, changed_files, comments, mergeable, conflict_files, review_decision, reviewers, requested_reviewers, labels, assignees, blockers, can_merge, checks, viewer_permission, created_at, updated_at]
      properties:
        number: { type: integer, format: int64 }
        repo: { type: string }
        title: { type: string }
        body: { type: string }
        body_html: { type: string, description: Rendered, sanitised HTML of the body. }
        state: { $ref: "#/components/schemas/PullState" }
        draft: { type: boolean }
        author: { $ref: "#/components/schemas/UserSummary" }
        head: { $ref: "#/components/schemas/PullBranch" }
        base: { $ref: "#/components/schemas/PullBranch" }
        merge_base: { type: string, description: Common ancestor of base and head. }
        commits: { type: integer }
        additions: { type: integer }
        deletions: { type: integer }
        changed_files: { type: integer }
        comments: { type: integer }
        mergeable:
          type: string
          enum: [clean, conflict, unknown]
          description: Whether head merges into base without conflicts. `unknown` for closed pull requests or a missing head.
        conflict_files: { type: array, items: { type: string } }
        behind_by: { type: integer, description: Base commits not in head. }
        review_decision: { $ref: "#/components/schemas/ReviewDecision" }
        reviewers:
          type: array
          description: Each reviewer's latest review state, plus requested reviewers who haven't reviewed.
          items: { $ref: "#/components/schemas/ReviewerState" }
        requested_reviewers: { type: array, items: { $ref: "#/components/schemas/UserSummary" } }
        labels: { type: array, items: { $ref: "#/components/schemas/Label" } }
        assignees: { type: array, items: { $ref: "#/components/schemas/UserSummary" } }
        milestone:
          allOf: [{ $ref: "#/components/schemas/MilestoneRef" }]
          nullable: true
        protection:
          allOf: [{ $ref: "#/components/schemas/BranchProtection" }]
          nullable: true
          description: The protection rule applying to the base branch, if any.
        blockers:
          type: array
          description: Why you can't merge right now; empty when you can.
          items: { $ref: "#/components/schemas/MergeBlocker" }
        can_merge: { type: boolean, description: You can merge now (blockers is empty). }
        checks: { $ref: "#/components/schemas/CheckSummary" }
        viewer_permission: { $ref: "#/components/schemas/Permission" }
        merged_by:
          allOf: [{ $ref: "#/components/schemas/UserSummary" }]
          nullable: true
        merge_commit: { type: string, nullable: true }
        merge_method: { type: string, nullable: true, description: "merge, squash, rebase, or manual (the head was pushed to the base outside tgp)." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        merged_at: { type: string, format: date-time, nullable: true }

    CreatePullRequest:
      type: object
      required: [title, head]
      properties:
        title: { type: string }
        body: { type: string }
        head: { type: string, description: Branch with the changes. }
        base: { type: string, description: Branch to merge into; defaults to the default branch. }
        draft: { type: boolean, default: false }
        reviewers: { type: array, items: { type: string }, description: Usernames to request reviews from. }
        labels: { type: array, items: { type: string }, description: Label names. }
        assignees: { type: array, items: { type: string }, description: Usernames. }
        milestone: { type: integer, format: int64, description: Milestone id. }

    UpdatePullRequest:
      type: object
      properties:
        title: { type: string }
        body: { type: string }
        base: { type: string, description: Change the base branch. }
        state: { type: string, enum: [open, closed], description: Close or reopen. }
        draft: { type: boolean, description: false marks the pull request ready for review. }
        reviewers: { type: array, items: { type: string }, description: Replaces the requested reviewers. }
        labels: { type: array, items: { type: string }, description: Replaces the labels. }
        add_labels: { type: array, items: { type: string } }
        remove_labels: { type: array, items: { type: string } }
        assignees: { type: array, items: { type: string }, description: Replaces the assignees. }
        add_assignees: { type: array, items: { type: string } }
        remove_assignees: { type: array, items: { type: string } }
        milestone: { type: integer, format: int64, description: Milestone id; 0 removes the milestone. }

    MergePullRequest:
      type: object
      properties:
        method: { $ref: "#/components/schemas/MergeMethod" }
        title: { type: string, description: Subject of the merge or squash commit. }
        message: { type: string, description: Body of the merge or squash commit. }
        sha: { type: string, description: Only merge if the head is still at this commit. }
        delete_branch: { type: boolean, default: false, description: Delete the head branch after merging. }
        bypass_protection:
          type: boolean
          default: false
          description: Admins only, when the rule allows it; merge despite missing approvals, change requests or an out-of-date branch.

    Comment:
      type: object
      required: [id, author, body, body_html, created_at, updated_at, edited]
      properties:
        id: { type: integer, format: int64 }
        author: { $ref: "#/components/schemas/UserSummary" }
        body: { type: string }
        body_html: { type: string }
        review_id: { type: integer, format: int64, nullable: true }
        reply_to: { type: integer, format: int64, nullable: true, description: The thread's first comment, for replies. }
        path: { type: string, description: File, for inline comments. }
        line: { type: integer, description: Line number on `side`, for inline comments. }
        side: { type: string, enum: [new, old] }
        commit_sha: { type: string, description: Head commit the inline comment was made on. }
        diff_hunk: { type: string, description: Diff lines leading up to the commented line, for context. }
        outdated: { type: boolean, description: The file changed since the comment was made, so the line may have moved. }
        resolved: { type: boolean }
        resolved_by:
          allOf: [{ $ref: "#/components/schemas/UserSummary" }]
          nullable: true
        edited: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateComment:
      type: object
      required: [body]
      properties:
        body: { type: string }
        path: { type: string }
        line: { type: integer, minimum: 1 }
        side: { type: string, enum: [new, old], default: new }
        reply_to: { type: integer, format: int64 }

    InlineCommentInput:
      type: object
      required: [path, line, body]
      properties:
        path: { type: string }
        line: { type: integer, minimum: 1 }
        side: { type: string, enum: [new, old], default: new }
        body: { type: string }

    Review:
      type: object
      required: [id, author, state, body, body_html, commit_sha, stale, dismissed, comments, created_at]
      properties:
        id: { type: integer, format: int64 }
        author: { $ref: "#/components/schemas/UserSummary" }
        state: { type: string, enum: [approved, changes_requested, commented] }
        body: { type: string }
        body_html: { type: string }
        commit_sha: { type: string }
        stale: { type: boolean, description: Made on an older head commit. }
        dismissed: { type: boolean }
        dismissed_by:
          allOf: [{ $ref: "#/components/schemas/UserSummary" }]
          nullable: true
        dismiss_message: { type: string }
        comments: { type: array, items: { $ref: "#/components/schemas/Comment" }, description: Inline comments submitted with the review. }
        created_at: { type: string, format: date-time }

    CreateReview:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [approve, request_changes, comment] }
        body: { type: string, description: Required when requesting changes or commenting without inline comments. }
        commit_sha: { type: string, description: Head commit you reviewed; rejected if the head has moved since. }
        comments: { type: array, items: { $ref: "#/components/schemas/InlineCommentInput" } }

    PullEvent:
      type: object
      required: [id, type, data, created_at]
      properties:
        id: { type: integer, format: int64 }
        type:
          type: string
          enum: [closed, reopened, merged, pushed, base_changed, title_changed, ready_for_review, converted_to_draft, review_requested, review_request_removed, review_dismissed, head_deleted, head_restored, branch_deleted, branch_updated, labeled, unlabeled, milestoned, demilestoned, assigned, unassigned]
        actor:
          allOf: [{ $ref: "#/components/schemas/UserSummary" }]
          nullable: true
        data:
          type: object
          additionalProperties: true
          description: |
            Type-specific: `pushed` {before, after, commits, forced}; `base_changed`
            and `title_changed` {from, to}; `merged` {commit, method}; `review_requested`
            and `review_request_removed` {reviewer}; `review_dismissed` {reviewer, message};
            `branch_deleted` {branch}; `branch_updated` {commit}; `labeled`/`unlabeled`
            {label, color}; `milestoned`/`demilestoned` {milestone}; `assigned`/`unassigned`
            {assignee}; `closed` on issues {reason, and pull + commit when closed by a
            merged pull request ("Fixes #12")}.
            Used for both pull requests and issues.
        created_at: { type: string, format: date-time }

    TimelineItem:
      type: object
      required: [kind, created_at]
      properties:
        kind: { type: string, enum: [comment, review, inline_comment, event] }
        created_at: { type: string, format: date-time }
        comment: { $ref: "#/components/schemas/Comment" }
        review: { $ref: "#/components/schemas/Review" }
        event: { $ref: "#/components/schemas/PullEvent" }

    Comparison:
      type: object
      required: [base, head, base_sha, head_sha, merge_base, ahead_by, behind_by, commits, diff, mergeable, conflict_files]
      properties:
        base: { type: string }
        head: { type: string }
        base_sha: { type: string }
        head_sha: { type: string }
        merge_base: { type: string }
        ahead_by: { type: integer }
        behind_by: { type: integer }
        commits: { type: array, items: { $ref: "#/components/schemas/Commit" }, description: Oldest first, at most 250. }
        diff: { $ref: "#/components/schemas/Diff" }
        mergeable: { type: string, enum: [clean, conflict] }
        conflict_files: { type: array, items: { type: string } }
        existing_pull: { type: integer, format: int64, nullable: true, description: An open pull request from head into base. }

    BranchProtection:
      type: object
      required: [id, pattern, require_pull_request, required_approvals, dismiss_stale_approvals, require_up_to_date, block_force_push, allow_deletion, admins_bypass, required_checks, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        pattern: { type: string, description: "Branch name or glob, e.g. `main` or `release/*`." }
        require_pull_request: { type: boolean, description: No direct pushes; changes land through pull requests. }
        required_approvals: { type: integer, description: Approvals needed to merge (from anyone but the author). }
        dismiss_stale_approvals: { type: boolean, description: Approvals of an older head commit don't count. }
        require_up_to_date: { type: boolean, description: The head must contain the latest base commit before merging. }
        block_force_push: { type: boolean }
        allow_deletion: { type: boolean }
        admins_bypass: { type: boolean, description: Admins may push directly and merge despite unmet requirements. }
        required_checks:
          type: array
          items: { type: string }
          description: "CI checks (`<workflow> / <job>`) that must pass on the head commit before merging."
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BranchProtectionInput:
      type: object
      required: [pattern]
      properties:
        pattern: { type: string }
        require_pull_request: { type: boolean, default: true }
        required_approvals: { type: integer, minimum: 0, maximum: 10, default: 1 }
        dismiss_stale_approvals: { type: boolean, default: true }
        require_up_to_date: { type: boolean, default: false }
        block_force_push: { type: boolean, default: true }
        allow_deletion: { type: boolean, default: false }
        admins_bypass: { type: boolean, default: false }
        required_checks: { type: array, items: { type: string }, maxItems: 50 }

    BranchProtectionPatch:
      type: object
      properties:
        pattern: { type: string }
        require_pull_request: { type: boolean }
        required_approvals: { type: integer, minimum: 0, maximum: 10 }
        dismiss_stale_approvals: { type: boolean }
        require_up_to_date: { type: boolean }
        block_force_push: { type: boolean }
        allow_deletion: { type: boolean }
        admins_bypass: { type: boolean }
        required_checks: { type: array, items: { type: string }, maxItems: 50 }

    Label:
      type: object
      required: [id, name, color, description]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        color: { type: string, description: "Six hex digits without #, e.g. d73a4a.", example: d73a4a }
        description: { type: string }
        open_issues: { type: integer, description: Open issues and pull requests with this label (in label lists only). }

    LabelInput:
      type: object
      required: [name, color]
      properties:
        name: { type: string }
        color: { type: string }
        description: { type: string }

    LabelPatch:
      type: object
      properties:
        name: { type: string }
        color: { type: string }
        description: { type: string }

    MilestoneRef:
      type: object
      required: [id, title, state]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        state: { type: string, enum: [open, closed] }
        due_on: { type: string, format: date, nullable: true }

    Milestone:
      type: object
      required: [id, title, description, description_html, state, open_issues, closed_issues, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        description: { type: string }
        description_html: { type: string }
        state: { type: string, enum: [open, closed] }
        due_on: { type: string, format: date, nullable: true }
        open_issues: { type: integer, description: Open issues and pull requests in the milestone. }
        closed_issues: { type: integer, description: Closed (and merged) issues and pull requests in the milestone. }
        closed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MilestoneInput:
      type: object
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        due_on: { type: string, format: date }

    MilestonePatch:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        due_on: { type: string, format: date, description: "Empty string clears it." }
        clear_due_on: { type: boolean, description: Remove the due date. }
        state: { type: string, enum: [open, closed] }

    IssueStateReason:
      type: string
      enum: [completed, not_planned]
      description: Why a closed issue was closed.

    IssueSummary:
      type: object
      required: [number, repo, title, state, author, labels, assignees, comments, created_at, updated_at]
      properties:
        number: { type: integer, format: int64 }
        repo: { type: string }
        title: { type: string }
        state: { type: string, enum: [open, closed] }
        state_reason:
          allOf: [{ $ref: "#/components/schemas/IssueStateReason" }]
          nullable: true
        author: { $ref: "#/components/schemas/UserSummary" }
        labels: { type: array, items: { $ref: "#/components/schemas/Label" } }
        assignees: { type: array, items: { $ref: "#/components/schemas/UserSummary" } }
        milestone:
          allOf: [{ $ref: "#/components/schemas/MilestoneRef" }]
          nullable: true
        comments: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }

    Issue:
      allOf:
        - { $ref: "#/components/schemas/IssueSummary" }
        - type: object
          required: [body, body_html, viewer_permission, can_edit]
          properties:
            body: { type: string }
            body_html: { type: string }
            closed_by:
              allOf: [{ $ref: "#/components/schemas/UserSummary" }]
              nullable: true
            viewer_permission: { $ref: "#/components/schemas/Permission" }
            can_edit: { type: boolean, description: You can edit the title and body. }

    IssuePage:
      type: object
      required: [issues, total]
      properties:
        issues: { type: array, items: { $ref: "#/components/schemas/IssueSummary" } }
        total: { type: integer }

    CreateIssue:
      type: object
      required: [title]
      properties:
        title: { type: string }
        body: { type: string }
        labels: { type: array, items: { type: string }, description: Label names. }
        assignees: { type: array, items: { type: string }, description: Usernames. }
        milestone: { type: integer, format: int64, description: Milestone id. }

    UpdateIssue:
      type: object
      properties:
        title: { type: string }
        body: { type: string }
        state: { type: string, enum: [open, closed] }
        state_reason: { $ref: "#/components/schemas/IssueStateReason" }
        labels: { type: array, items: { type: string } }
        add_labels: { type: array, items: { type: string } }
        remove_labels: { type: array, items: { type: string } }
        assignees: { type: array, items: { type: string } }
        add_assignees: { type: array, items: { type: string } }
        remove_assignees: { type: array, items: { type: string } }
        milestone: { type: integer, format: int64, description: Milestone id; 0 removes the milestone. }

    RunEvent:
      type: string
      enum: [push, pull_request, workflow_dispatch, release]

    RunStatus:
      type: string
      enum: [waiting, queued, in_progress, completed]
      description: "`waiting`: held back by a concurrency group. `queued`: jobs waiting for a runner."

    JobStatus:
      type: string
      enum: [pending, queued, in_progress, completed]
      description: "`pending`: waiting for the jobs it needs (or its run's concurrency group). `queued`: ready, waiting for a runner."

    Conclusion:
      type: string
      enum: [success, failure, cancelled, skipped, timed_out]

    WorkflowRun:
      type: object
      required: [id, number, repo, workflow_path, workflow_name, title, event, ref, head_sha, status, attempt, created_at]
      properties:
        id: { type: integer, format: int64 }
        number: { type: integer, format: int64, description: Run number, counted per repository. }
        repo: { type: string }
        workflow_path: { type: string, description: "e.g. `.tgp/workflows/ci.yml`" }
        workflow_name: { type: string }
        title: { type: string, description: Commit subject or pull request title. }
        event: { $ref: "#/components/schemas/RunEvent" }
        ref: { type: string, description: "Full ref: `refs/heads/main`, `refs/tags/v1`, `refs/pull/3/head`." }
        head_branch: { type: string, nullable: true }
        head_sha: { type: string }
        pull_number: { type: integer, format: int64, nullable: true }
        actor:
          allOf: [{ $ref: "#/components/schemas/UserSummary" }]
          nullable: true
        status: { $ref: "#/components/schemas/RunStatus" }
        conclusion:
          allOf: [{ $ref: "#/components/schemas/Conclusion" }]
          nullable: true
        status_reason:
          type: string
          nullable: true
          description: Why the run ended the way it did when it isn't obvious, e.g. superseded by a newer push, queue full, invalid workflow.
        attempt: { type: integer }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }

    WorkflowRunDetail:
      allOf:
        - $ref: "#/components/schemas/WorkflowRun"
        - type: object
          required: [jobs, inputs, can_cancel, can_rerun]
          properties:
            jobs: { type: array, items: { $ref: "#/components/schemas/Job" } }
            inputs: { type: object, additionalProperties: { type: string } }
            can_cancel: { type: boolean }
            can_rerun: { type: boolean }

    RunPage:
      type: object
      required: [runs, total]
      properties:
        runs: { type: array, items: { $ref: "#/components/schemas/WorkflowRun" } }
        total: { type: integer }

    JobResources:
      type: object
      required: [cpus, memory_bytes, pids]
      properties:
        cpus: { type: number }
        memory_bytes: { type: integer, format: int64 }
        pids: { type: integer }

    RunnerRef:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }

    Job:
      type: object
      required: [id, run_number, attempt, key, name, check_name, needs, status, labels, image, resources, timeout_minutes, steps, created_at]
      properties:
        id: { type: integer, format: int64 }
        run_number: { type: integer, format: int64 }
        attempt: { type: integer }
        key: { type: string, description: The job's id in the workflow file. }
        name: { type: string, description: "Display name, including matrix values." }
        check_name: { type: string, description: "`<workflow name> / <job name>`, the name used by required checks." }
        matrix: { type: object, nullable: true, additionalProperties: true }
        needs: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/JobStatus" }
        conclusion:
          allOf: [{ $ref: "#/components/schemas/Conclusion" }]
          nullable: true
        failure_reason: { type: string, nullable: true, description: "Set when the job failed outside its steps, e.g. runner lost, timed out, image pull failed." }
        wait_reason: { type: string, nullable: true, description: Why a queued job hasn't started yet. }
        runner:
          allOf: [{ $ref: "#/components/schemas/RunnerRef" }]
          nullable: true
        labels: { type: array, items: { type: string }, description: Runner labels the job needs (runs-on). }
        image: { type: string }
        resources: { $ref: "#/components/schemas/JobResources" }
        timeout_minutes: { type: integer }
        steps: { type: array, items: { $ref: "#/components/schemas/JobStep" } }
        created_at: { type: string, format: date-time }
        queued_at: { type: string, format: date-time, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }

    JobStep:
      type: object
      required: [number, name, status]
      properties:
        number: { type: integer, description: "1-based; step 0 is the job's setup (pulling images, starting services)." }
        name: { type: string }
        status: { type: string, enum: [pending, in_progress, completed] }
        conclusion: { type: string, nullable: true, enum: [success, failure, cancelled, skipped] }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }

    LogLine:
      type: object
      required: [n, step, t, text]
      properties:
        n: { type: integer, description: Line number, from 1. }
        step: { type: integer, description: Step number (0 = setup, -1 = cleanup). }
        t: { type: string, format: date-time }
        text: { type: string }

    JobLogs:
      type: object
      required: [lines, next, complete, truncated]
      properties:
        lines: { type: array, items: { $ref: "#/components/schemas/LogLine" } }
        next: { type: integer, description: Pass as `after` to get the following lines. }
        complete: { type: boolean, description: The job has finished and every line has been returned. }
        truncated: { type: boolean, description: The log hit the size limit; later output was dropped. }

    WorkflowError:
      type: object
      required: [message]
      properties:
        line: { type: integer }
        column: { type: integer }
        message: { type: string }

    DispatchInput:
      type: object
      required: [name, description, required, type]
      properties:
        name: { type: string }
        description: { type: string }
        required: { type: boolean }
        default: { type: string, nullable: true }
        type: { type: string, enum: [string, boolean, number, choice] }
        options: { type: array, items: { type: string } }

    Workflow:
      type: object
      required: [path, file, name, valid, errors, triggers, dispatch_inputs, jobs]
      properties:
        path: { type: string }
        file: { type: string, description: "File name, e.g. `ci.yml`; use it in dispatch and filters." }
        name: { type: string }
        valid: { type: boolean }
        errors: { type: array, items: { $ref: "#/components/schemas/WorkflowError" } }
        triggers: { type: array, items: { $ref: "#/components/schemas/RunEvent" } }
        dispatch_inputs: { type: array, items: { $ref: "#/components/schemas/DispatchInput" } }
        jobs: { type: array, items: { type: string } }

    DispatchRequest:
      type: object
      properties:
        ref: { type: string, description: Branch or tag to run on. Defaults to the default branch. }
        inputs: { type: object, additionalProperties: { type: string } }

    RerunRequest:
      type: object
      properties:
        failed_only: { type: boolean, default: false }

    Check:
      type: object
      required: [name, workflow, job_name, run_number, job_id, status, required]
      properties:
        name: { type: string, description: "`<workflow> / <job>`" }
        workflow: { type: string }
        job_name: { type: string }
        run_number: { type: integer, format: int64 }
        job_id: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/JobStatus" }
        conclusion:
          allOf: [{ $ref: "#/components/schemas/Conclusion" }]
          nullable: true
        required: { type: boolean, description: Branch protection requires this check. }
        started_at: { type: string, format: date-time, nullable: true }
        completed_at: { type: string, format: date-time, nullable: true }

    CheckSummary:
      type: object
      required: [state, total, succeeded, failed, pending, skipped, checks, missing_required]
      properties:
        state:
          type: string
          enum: [none, pending, success, failure]
          description: "`failure` if any check failed, else `pending` if any is still running or a required check hasn't reported, else `success`; `none` without checks."
        total: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        pending: { type: integer }
        skipped: { type: integer }
        checks: { type: array, items: { $ref: "#/components/schemas/Check" } }
        missing_required: { type: array, items: { type: string }, description: Required checks that haven't reported for this commit. }

    Secret:
      type: object
      required: [name, scope, updated_at]
      properties:
        name: { type: string }
        scope: { type: string, enum: [repo, org] }
        updated_at: { type: string, format: date-time }
        updated_by:
          allOf: [{ $ref: "#/components/schemas/UserSummary" }]
          nullable: true

    SecretValue:
      type: object
      required: [value]
      properties:
        value: { type: string, maxLength: 65536 }

    RunnerJob:
      type: object
      required: [id, repo, run_number, name]
      properties:
        id: { type: integer, format: int64 }
        repo: { type: string }
        run_number: { type: integer, format: int64 }
        name: { type: string }

    Runner:
      type: object
      required: [id, name, labels, status, version, os, arch, capacity, busy, jobs, created_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        labels: { type: array, items: { type: string } }
        status: { type: string, enum: [online, offline, disabled] }
        version: { type: string }
        os: { type: string }
        arch: { type: string }
        capacity: { type: integer, description: Jobs it runs at once. }
        busy: { type: integer, description: Jobs it is running now. }
        cpu_percent: { type: number, nullable: true, description: Host CPU load (load average ÷ cores) from the last heartbeat. }
        memory_percent: { type: number, nullable: true }
        overloaded: { type: boolean, description: Load is above the limit, so it gets no new jobs. }
        jobs: { type: array, items: { $ref: "#/components/schemas/RunnerJob" } }
        last_seen_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    RunnerList:
      type: object
      required: [runners, queued_jobs, running_jobs]
      properties:
        runners: { type: array, items: { $ref: "#/components/schemas/Runner" } }
        queued_jobs: { type: integer }
        running_jobs: { type: integer }

    RunnerRegistrationToken:
      type: object
      required: [token, expires_at, command]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
        command: { type: string, description: A ready-to-run tgp-runner register command. }

    HealthStatus:
      type: string
      enum: [ok, warn, fail]
      description: ok = healthy, warn = needs attention soon, fail = broken now.

    HealthCheck:
      type: object
      required: [name, status, message]
      properties:
        name: { type: string, description: "Stable identifier, e.g. database, storage, disk, runners, ci_queue, webhooks, migrations, master_key." }
        status: { $ref: "#/components/schemas/HealthStatus" }
        message: { type: string }

    HealthHost:
      type: object
      required: [hostname, os, arch, cpus, goroutines, memory_bytes]
      properties:
        hostname: { type: string }
        os: { type: string }
        arch: { type: string }
        cpus: { type: integer }
        goroutines: { type: integer }
        memory_bytes: { type: integer, format: int64, description: Memory the server process got from the OS. }

    HealthDatabase:
      type: object
      required: [driver, ok, latency_ms, schema_version, pending_migrations]
      properties:
        driver: { type: string, enum: [sqlite, postgres] }
        ok: { type: boolean }
        error: { type: string }
        latency_ms: { type: number, description: Round trip of a trivial query. }
        size_bytes: { type: integer, format: int64, nullable: true }
        schema_version: { type: string, description: Name of the newest applied migration. }
        pending_migrations: { type: integer }

    HealthDisk:
      type: object
      required: [path, uses, total_bytes, free_bytes, used_bytes]
      properties:
        path: { type: string }
        uses:
          type: array
          description: What tgp keeps on this filesystem.
          items: { type: string, enum: [data, repos, storage, database] }
        total_bytes: { type: integer, format: int64 }
        free_bytes: { type: integer, format: int64, description: Bytes available to the server process. }
        used_bytes: { type: integer, format: int64, description: Total minus free; includes space reserved for root, which the server can't use. }

    HealthStorage:
      type: object
      required: [type, ok, logs_bytes, artifacts_bytes, artifacts_count, caches_bytes, caches_count, release_assets_bytes, release_assets_count, total_bytes]
      properties:
        type: { type: string, enum: [local, s3] }
        ok: { type: boolean }
        error: { type: string }
        logs_bytes: { type: integer, format: int64 }
        artifacts_bytes: { type: integer, format: int64 }
        artifacts_count: { type: integer }
        caches_bytes: { type: integer, format: int64 }
        caches_count: { type: integer }
        release_assets_bytes: { type: integer, format: int64 }
        release_assets_count: { type: integer }
        total_bytes: { type: integer, format: int64 }

    RepoUsage:
      type: object
      required: [name, archived, git_bytes, logs_bytes, artifacts_bytes, caches_bytes, release_assets_bytes, total_bytes]
      properties:
        name: { type: string }
        archived: { type: boolean }
        pushed_at: { type: string, format: date-time, nullable: true }
        git_bytes: { type: integer, format: int64, description: Size of the bare repository on disk. }
        logs_bytes: { type: integer, format: int64 }
        artifacts_bytes: { type: integer, format: int64 }
        caches_bytes: { type: integer, format: int64 }
        release_assets_bytes: { type: integer, format: int64 }
        total_bytes: { type: integer, format: int64 }

    HealthRepos:
      type: object
      required: [count, git_bytes, measured_at, items]
      properties:
        count: { type: integer }
        git_bytes: { type: integer, format: int64 }
        measured_at: { type: string, format: date-time, description: When repository sizes on disk were measured. }
        items:
          type: array
          description: Every repository, largest total first.
          items: { $ref: "#/components/schemas/RepoUsage" }

    HealthCI:
      type: object
      required: [queued_jobs, running_jobs, runners_online, runners_offline, runners_disabled, slots_total, slots_busy]
      properties:
        queued_jobs: { type: integer }
        running_jobs: { type: integer }
        oldest_queued_at: { type: string, format: date-time, nullable: true }
        runners_online: { type: integer }
        runners_offline: { type: integer }
        runners_disabled: { type: integer }
        slots_total: { type: integer, description: Capacity of online, enabled runners. }
        slots_busy: { type: integer }

    HealthWebhooks:
      type: object
      required: [hooks, active_hooks, pending_deliveries, retrying_deliveries, failed_deliveries_24h]
      properties:
        hooks: { type: integer }
        active_hooks: { type: integer }
        pending_deliveries: { type: integer, description: Deliveries waiting for their first or next attempt. }
        retrying_deliveries: { type: integer, description: Pending deliveries that already failed at least once. }
        failed_deliveries_24h: { type: integer }
        oldest_pending_at: { type: string, format: date-time, nullable: true }

    HealthCounts:
      type: object
      required: [users, disabled_users, sessions, repos, open_pulls, open_issues]
      properties:
        users: { type: integer }
        disabled_users: { type: integer }
        sessions: { type: integer, description: Unexpired sign-in sessions. }
        repos: { type: integer }
        open_pulls: { type: integer }
        open_issues: { type: integer }

    ServerHealth:
      type: object
      required: [status, checks, version, commit, started_at, uptime_seconds, generated_at, host, database, disks, storage, repos, ci, webhooks, counts]
      properties:
        status: { $ref: "#/components/schemas/HealthStatus" }
        checks:
          type: array
          description: Every check, worst first. `status` is the worst of these.
          items: { $ref: "#/components/schemas/HealthCheck" }
        version: { type: string }
        commit: { type: string }
        started_at: { type: string, format: date-time }
        uptime_seconds: { type: integer, format: int64 }
        generated_at: { type: string, format: date-time }
        host: { $ref: "#/components/schemas/HealthHost" }
        database: { $ref: "#/components/schemas/HealthDatabase" }
        disks: { type: array, items: { $ref: "#/components/schemas/HealthDisk" } }
        storage: { $ref: "#/components/schemas/HealthStorage" }
        repos: { $ref: "#/components/schemas/HealthRepos" }
        ci: { $ref: "#/components/schemas/HealthCI" }
        webhooks: { $ref: "#/components/schemas/HealthWebhooks" }
        counts: { $ref: "#/components/schemas/HealthCounts" }

    CISettings:
      type: object
      required: [max_concurrent_jobs, max_jobs_per_repo, max_queued_runs_per_repo, runner_max_cpu_percent, runner_offline_after_seconds, default_image, default_cpus, max_cpus, default_memory_mb, max_memory_mb, default_pids, max_pids, default_timeout_minutes, max_timeout_minutes, max_log_mb, log_retention_days, cancel_superseded, artifact_max_mb, artifact_retention_days, cache_quota_mb, cache_retention_days, release_asset_max_mb]
      properties:
        max_concurrent_jobs: { type: integer, minimum: 0, description: Jobs running at once across the instance; 0 = no limit beyond runner capacity. }
        max_jobs_per_repo: { type: integer, minimum: 0, description: Jobs one repository may run at once; 0 = no limit. }
        max_queued_runs_per_repo: { type: integer, minimum: 0, description: Unstarted runs a repository may have; older runs for the same branch are superseded first, then new runs are rejected. 0 = no limit. }
        runner_max_cpu_percent: { type: integer, minimum: 0, description: Runners reporting more CPU load than this get no new jobs; 0 = ignore load. }
        runner_offline_after_seconds: { type: integer, minimum: 20, description: A runner silent this long is offline and its jobs fail. }
        default_image: { type: string, description: Image for jobs without container. }
        default_cpus: { type: number, minimum: 0.1 }
        max_cpus: { type: number, minimum: 0.1 }
        default_memory_mb: { type: integer, minimum: 16 }
        max_memory_mb: { type: integer, minimum: 16 }
        default_pids: { type: integer, minimum: 16 }
        max_pids: { type: integer, minimum: 16 }
        default_timeout_minutes: { type: integer, minimum: 1 }
        max_timeout_minutes: { type: integer, minimum: 1 }
        max_log_mb: { type: integer, minimum: 1, description: Log size cap per job; output beyond it is dropped. }
        log_retention_days: { type: integer, minimum: 0, description: Delete job logs older than this; 0 = keep. }
        cancel_superseded: { type: boolean, description: A new push to a branch or pull request cancels its older runs (not on the default branch or tags). }
        artifact_max_mb: { type: integer, minimum: 1, description: Largest artifact a job may upload (zipped). }
        artifact_retention_days: { type: integer, minimum: 1, description: Artifacts are deleted this long after upload; workflows may ask for less with retention-days. }
        cache_quota_mb: { type: integer, minimum: 0, description: CI cache space per repository; the least recently used caches are evicted above it. 0 = no limit. }
        cache_retention_days: { type: integer, minimum: 1, description: Caches not used for this long are deleted. }
        release_asset_max_mb: { type: integer, minimum: 1, description: Largest file that can be attached to a release. }

    CISettingsPatch:
      type: object
      properties:
        max_concurrent_jobs: { type: integer, minimum: 0 }
        max_jobs_per_repo: { type: integer, minimum: 0 }
        max_queued_runs_per_repo: { type: integer, minimum: 0 }
        runner_max_cpu_percent: { type: integer, minimum: 0, maximum: 1000 }
        runner_offline_after_seconds: { type: integer, minimum: 20, maximum: 3600 }
        default_image: { type: string }
        default_cpus: { type: number, minimum: 0.1 }
        max_cpus: { type: number, minimum: 0.1 }
        default_memory_mb: { type: integer, minimum: 16 }
        max_memory_mb: { type: integer, minimum: 16 }
        default_pids: { type: integer, minimum: 16 }
        max_pids: { type: integer, minimum: 16 }
        default_timeout_minutes: { type: integer, minimum: 1 }
        max_timeout_minutes: { type: integer, minimum: 1 }
        max_log_mb: { type: integer, minimum: 1, maximum: 1024 }
        log_retention_days: { type: integer, minimum: 0 }
        cancel_superseded: { type: boolean }
        artifact_max_mb: { type: integer, minimum: 1 }
        artifact_retention_days: { type: integer, minimum: 1, maximum: 3650 }
        cache_quota_mb: { type: integer, minimum: 0 }
        cache_retention_days: { type: integer, minimum: 1, maximum: 3650 }
        release_asset_max_mb: { type: integer, minimum: 1 }

    Artifact:
      type: object
      required: [id, name, size_bytes, sha256, run_number, attempt, job_name, created_at, expires_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        size_bytes: { type: integer, format: int64, description: Size of the zip file. }
        sha256: { type: string, description: SHA-256 of the zip file. }
        run_number: { type: integer, format: int64 }
        attempt: { type: integer }
        job_id: { type: integer, format: int64, nullable: true }
        job_name: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    ArtifactPage:
      type: object
      required: [artifacts, total, total_bytes]
      properties:
        artifacts: { type: array, items: { $ref: "#/components/schemas/Artifact" } }
        total: { type: integer }
        total_bytes: { type: integer, format: int64, description: Size of all the repository's artifacts. }

    CacheEntry:
      type: object
      required: [id, key, version, ref, size_bytes, created_at, last_used_at]
      properties:
        id: { type: integer, format: int64 }
        key: { type: string }
        version: { type: string, description: Hash of the cached paths; a cache only restores into a step with the same paths. }
        ref: { type: string, description: Ref of the run that saved it; runs read caches from their own ref, then the base and default branches. }
        size_bytes: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }

    CachePage:
      type: object
      required: [caches, total, total_bytes, quota_bytes]
      properties:
        caches: { type: array, items: { $ref: "#/components/schemas/CacheEntry" } }
        total: { type: integer }
        total_bytes: { type: integer, format: int64 }
        quota_bytes: { type: integer, format: int64, description: The repository's cache quota; least recently used caches are evicted above it. 0 = no limit. }

    DeletedCount:
      type: object
      required: [deleted]
      properties:
        deleted: { type: integer }

    ReleaseAsset:
      type: object
      required: [id, name, label, content_type, size_bytes, sha256, download_count, created_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        label: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        sha256: { type: string }
        download_count: { type: integer, format: int64 }
        uploader:
          allOf: [{ $ref: "#/components/schemas/UserSummary" }]
          nullable: true
        created_at: { type: string, format: date-time }

    Release:
      type: object
      required: [id, tag, name, body, body_html, draft, prerelease, latest, target, created_at, assets]
      properties:
        id: { type: integer, format: int64 }
        tag: { type: string }
        name: { type: string, description: Title; empty means the tag is shown. }
        body: { type: string, description: Release notes (Markdown). }
        body_html: { type: string }
        draft: { type: boolean }
        prerelease: { type: boolean }
        latest: { type: boolean, description: The newest published release that isn't a prerelease. }
        target: { type: string, description: Branch or commit the tag is created at if it doesn't exist. }
        sha: { type: string, nullable: true, description: Commit the tag points to (null for drafts whose tag doesn't exist yet). }
        author:
          allOf: [{ $ref: "#/components/schemas/UserSummary" }]
          nullable: true
        created_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time, nullable: true }
        assets: { type: array, items: { $ref: "#/components/schemas/ReleaseAsset" } }

    ReleasePage:
      type: object
      required: [releases, total]
      properties:
        releases: { type: array, items: { $ref: "#/components/schemas/Release" } }
        total: { type: integer }

    CreateRelease:
      type: object
      required: [tag]
      properties:
        tag: { type: string, maxLength: 200 }
        target: { type: string, description: Branch or commit for a new tag (default the default branch). }
        name: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 200000 }
        draft: { type: boolean, default: false }
        prerelease: { type: boolean, default: false }

    UpdateRelease:
      type: object
      properties:
        tag: { type: string, maxLength: 200 }
        target: { type: string }
        name: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 200000 }
        draft: { type: boolean }
        prerelease: { type: boolean }

    WebhookEventInfo:
      type: object
      required: [name, description, actions]
      properties:
        name: { type: string }
        description: { type: string }
        actions: { type: array, items: { type: string }, description: "Values of the payload's `action` (empty for events without one)." }

    Webhook:
      type: object
      required: [id, scope, url, events, active, has_secret, insecure_ssl, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        scope: { type: string, enum: [repo, org], description: "org webhooks get events from every repository." }
        repo: { type: string, nullable: true }
        url: { type: string }
        events: { type: array, items: { type: string }, description: "Event names, or `*` for all." }
        active: { type: boolean }
        has_secret: { type: boolean, description: Deliveries are signed (the secret itself is never shown). }
        insecure_ssl: { type: boolean, description: TLS certificates aren't verified. }
        created_by:
          allOf: [{ $ref: "#/components/schemas/UserSummary" }]
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_delivery:
          allOf: [{ $ref: "#/components/schemas/WebhookDelivery" }]
          nullable: true

    WebhookInput:
      type: object
      required: [url]
      properties:
        url: { type: string, maxLength: 2000, description: "http(s) URL that receives POST requests." }
        events: { type: array, items: { type: string }, description: "Default: [push]." }
        secret: { type: string, maxLength: 256, description: "Signs deliveries (X-Tgp-Signature-256 / X-Hub-Signature-256)." }
        active: { type: boolean, default: true }
        insecure_ssl: { type: boolean, default: false }

    WebhookPatch:
      type: object
      properties:
        url: { type: string, maxLength: 2000 }
        events: { type: array, items: { type: string } }
        secret: { type: string, maxLength: 256, description: An empty string removes the secret. }
        active: { type: boolean }
        insecure_ssl: { type: boolean }

    WebhookDeliveryStatus:
      type: string
      enum: [pending, success, failed]

    WebhookDelivery:
      type: object
      required: [id, guid, event, status, redelivery, attempts, created_at]
      properties:
        id: { type: integer, format: int64 }
        guid: { type: string, description: "The X-Tgp-Delivery header." }
        event: { type: string }
        action: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/WebhookDeliveryStatus" }
        redelivery: { type: boolean }
        attempts: { type: integer }
        response_status: { type: integer, nullable: true, description: HTTP status of the last attempt. }
        duration_ms: { type: integer, nullable: true }
        error: { type: string, nullable: true, description: Why the last attempt failed. }
        created_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time, nullable: true }
        next_attempt_at: { type: string, format: date-time, nullable: true, description: When a pending delivery is tried next. }

    WebhookDeliveryDetail:
      allOf:
        - $ref: "#/components/schemas/WebhookDelivery"
        - type: object
          required: [request]
          properties:
            request:
              type: object
              required: [url, headers, payload]
              properties:
                url: { type: string }
                headers: { type: object, additionalProperties: { type: string } }
                payload: { type: object, additionalProperties: true }
            response:
              type: object
              nullable: true
              required: [headers, body, truncated]
              properties:
                headers: { type: object, additionalProperties: { type: string } }
                body: { type: string }
                truncated: { type: boolean }

    WebhookDeliveryPage:
      type: object
      required: [deliveries, total]
      properties:
        deliveries: { type: array, items: { $ref: "#/components/schemas/WebhookDelivery" } }
        total: { type: integer }
