openapi: 3.0.3
info:
  title: tgp API
  version: 1.0.0
  description: |
    REST API for tgp, a self-hosted git platform for a single team.
    The web UI and the `tgp` CLI are both built on this API.

    ## Authentication
    - **Browser sessions** use the `tgp_session` cookie set by `POST /auth/login`.
      Unsafe requests (POST/PUT/PATCH/DELETE) made with the cookie must echo the
      `tgp_csrf` cookie value in the `X-CSRF-Token` header.
    - **Personal access tokens** go in `Authorization: Bearer tgp_pat_...` (or
      `Authorization: token ...`). No CSRF header is needed. Token scopes:
      `read` (GET requests), `write` (everything else), `admin` (admin endpoints;
      the user must also be an admin).

    ## Errors
    Errors always use the `Error` schema: `{"error": {"code": "...", "message": "..."}}`.
    Codes are stable: `bad_request`, `validation_failed`, `unauthenticated`, `forbidden`,
    `not_found`, `conflict`, `rate_limited`, `setup_required`, `password_change_required`,
    `totp_required`, `internal_error`.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: meta
  - name: setup
  - name: auth
  - name: account
  - name: users
  - name: org
  - name: admin
  - name: repos
  - name: code
  - name: pulls
paths:
  /meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: Server version and setup state
      description: Public. Clients use it to detect a tgp server and whether first-start setup is pending.
      security: []
      responses:
        "200":
          description: Server metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }
        default: { $ref: "#/components/responses/Error" }

  /setup:
    post:
      operationId: completeSetup
      tags: [setup]
      summary: Complete first-start setup
      description: |
        Creates the first admin, configures the org and optionally creates more
        users, all in one transaction. Requires the one-time setup token printed
        in the server log. Only works while setup is pending. On success the
        caller is logged in as the new admin.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "200":
          description: Setup complete
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupResponse" }
        default: { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with username and password
      description: |
        Sets the session cookie. If the user has 2FA enabled and neither
        `totp_code` nor `recovery_code` is given, fails with `totp_required`;
        resend with a code. If the response has `must_change_password: true`,
        only `getSession`, `logout` and `changePassword` work until the password
        is changed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        default: { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204": { description: Logged out }
        default: { $ref: "#/components/responses/Error" }

  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: The current user and how they authenticated
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        default: { $ref: "#/components/responses/Error" }

  /account/password:
    post:
      operationId: changePassword
      tags: [account]
      summary: Change your password
      description: For a user with a temporary password, `current_password` is the temporary password. Signs out your other sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }

  /account/totp:
    post:
      operationId: startTotpSetup
      tags: [account]
      summary: Begin 2FA setup
      description: Generates a new TOTP secret. It isn't active until confirmed with `enableTotp`.
      responses:
        "200":
          description: Pending TOTP secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpSetup" }
        default: { $ref: "#/components/responses/Error" }

  /account/totp/enable:
    post:
      operationId: enableTotp
      tags: [account]
      summary: Confirm 2FA setup with a code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "123456" }
      responses:
        "200":
          description: 2FA enabled; recovery codes are shown only now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        default: { $ref: "#/components/responses/Error" }

  /account/totp/disable:
    post:
      operationId: disableTotp
      tags: [account]
      summary: Turn off 2FA
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirm" }
      responses:
        "204": { description: 2FA disabled }
        default: { $ref: "#/components/responses/Error" }

  /account/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [account]
      summary: Replace your 2FA recovery codes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirm" }
      responses:
        "200":
          description: New recovery codes; old ones stop working
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        default: { $ref: "#/components/responses/Error" }

  /account/tokens:
    get:
      operationId: listTokens
      tags: [account]
      summary: List your personal access tokens
      responses:
        "200":
          description: Tokens (secrets are never returned again)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccessToken" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createToken
      tags: [account]
      summary: Create a personal access token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTokenRequest" }
      responses:
        "201":
          description: Token created; `token` is shown only once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedToken" }
        default: { $ref: "#/components/responses/Error" }

  /account/tokens/{id}:
    delete:
      operationId: deleteToken
      tags: [account]
      summary: Revoke a personal access token
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Error" }

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List team members
      description: Basic info about every active user, e.g. for picking reviewers.
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserSummary" }
        default: { $ref: "#/components/responses/Error" }

  /org:
    get:
      operationId: getOrg
      tags: [org]
      summary: Org settings
      responses:
        "200":
          description: Org
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        default: { $ref: "#/components/responses/Error" }

  /org/logo:
    get:
      operationId: getOrgLogo
      tags: [org]
      summary: Org logo image
      security: []
      responses:
        "200":
          description: Logo
          content:
            image/*:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /admin/org:
    patch:
      operationId: updateOrg
      tags: [admin]
      summary: Update org settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrgRequest" }
      responses:
        "200":
          description: Updated org
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        default: { $ref: "#/components/responses/Error" }

  /admin/org/logo:
    put:
      operationId: uploadOrgLogo
      tags: [admin]
      summary: Upload the org logo
      description: Raw PNG, JPEG, GIF or WebP bytes, at most 512 KiB.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Updated org
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Org" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteOrgLogo
      tags: [admin]
      summary: Remove the org logo
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Error" }

  /admin/users:
    get:
      operationId: adminListUsers
      tags: [admin]
      summary: List all users with admin details
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: adminCreateUser
      tags: [admin]
      summary: Create a user with a temporary password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: User created; `temp_password` is shown only once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserWithTempPassword" }
        default: { $ref: "#/components/responses/Error" }

  /admin/users/{username}:
    parameters:
      - { name: username, in: path, required: true, schema: { type: string } }
    get:
      operationId: adminGetUser
      tags: [admin]
      summary: Get a user
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: adminUpdateUser
      tags: [admin]
      summary: Update a user's profile, role, repo access or disabled state
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }

  /admin/users/{username}/reset-password:
    parameters:
      - { name: username, in: path, required: true, schema: { type: string } }
    post:
      operationId: adminResetPassword
      tags: [admin]
      summary: Issue a new temporary password
      description: Signs the user out everywhere. They must set a new password at next login.
      responses:
        "200":
          description: New temporary password, shown only once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserWithTempPassword" }
        default: { $ref: "#/components/responses/Error" }

  /admin/users/{username}/reset-totp:
    parameters:
      - { name: username, in: path, required: true, schema: { type: string } }
    post:
      operationId: adminResetTotp
      tags: [admin]
      summary: Turn off a user's 2FA (e.g. lost device)
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        default: { $ref: "#/components/responses/Error" }

  /admin/audit-log:
    get:
      operationId: listAuditLog
      tags: [admin]
      summary: Security audit log, newest first
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: before, in: query, description: Return entries with id lower than this (cursor from `next_before`)., schema: { type: integer, format: int64 } }
        - { name: actor, in: query, description: Filter by actor username., schema: { type: string } }
        - { name: action, in: query, description: "Filter by action prefix, e.g. `user.` or `auth.login`.", schema: { type: string } }
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        default: { $ref: "#/components/responses/Error" }

  /repos:
    get:
      operationId: listRepos
      tags: [repos]
      summary: List repositories you can access
      parameters:
        - { name: q, in: query, description: Case-insensitive substring filter on the name., schema: { type: string } }
      responses:
        "200":
          description: Repositories, most recently pushed first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Repo" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createRepo
      tags: [repos]
      summary: Create a repository (admins)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRepoRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repo" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}:
    parameters:
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: getRepo
      tags: [repos]
      summary: Get a repository
      responses:
        "200":
          description: Repository
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repo" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateRepo
      tags: [repos]
      summary: Update a repository
      description: Maintainers can change the description and default branch. Renaming and archiving need an admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRepoRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Repo" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteRepo
      tags: [repos]
      summary: Permanently delete a repository (admins)
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/access:
    parameters:
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: listRepoAccess
      tags: [repos]
      summary: Who can access this repository, and how
      responses:
        "200":
          description: Users with access
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RepoAccess" } }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/branches:
    parameters:
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: listBranches
      tags: [code]
      summary: List branches, most recently updated first
      responses:
        "200":
          description: Branches
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Ref" } }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/tags:
    parameters:
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: listTags
      tags: [code]
      summary: List tags, newest first
      responses:
        "200":
          description: Tags
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Ref" } }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/tree:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/RefParam"
      - $ref: "#/components/parameters/PathParam"
    get:
      operationId: getTree
      tags: [code]
      summary: List a directory
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tree" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/blob:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/RefParam"
      - $ref: "#/components/parameters/RequiredPathParam"
    get:
      operationId: getBlob
      tags: [code]
      summary: Get a file's content
      description: Text files up to 1 MiB are returned as UTF-8; binary files as base64 (up to 1 MiB). Use `raw` for full content.
      responses:
        "200":
          description: File
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Blob" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/raw:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/RefParam"
      - $ref: "#/components/parameters/RequiredPathParam"
    get:
      operationId: getRaw
      tags: [code]
      summary: Download a file's raw bytes
      responses:
        "200":
          description: File content
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/readme:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/RefParam"
      - $ref: "#/components/parameters/PathParam"
    get:
      operationId: getReadme
      tags: [code]
      summary: The README of a directory, rendered to HTML
      responses:
        "200":
          description: README
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readme" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/commits:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/RefParam"
      - $ref: "#/components/parameters/PathParam"
      - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
    get:
      operationId: listCommits
      tags: [code]
      summary: Commit history, newest first
      responses:
        "200":
          description: Commits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitPage" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/commits/{sha}:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - { name: sha, in: path, required: true, description: Commit id or any ref., schema: { type: string } }
    get:
      operationId: getCommit
      tags: [code]
      summary: A commit with its diff
      responses:
        "200":
          description: Commit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitDetail" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/blame:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/RefParam"
      - $ref: "#/components/parameters/RequiredPathParam"
    get:
      operationId: getBlame
      tags: [code]
      summary: Line-by-line authorship of a file
      responses:
        "200":
          description: Blame
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Blame" }
        default: { $ref: "#/components/responses/Error" }

  /markdown:
    post:
      operationId: renderMarkdown
      tags: [code]
      summary: Render markdown to sanitised HTML
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                repo: { type: string, description: Resolve relative links in this repository. }
                ref: { type: string }
      responses:
        "200":
          description: Rendered HTML
          content:
            application/json:
              schema:
                type: object
                required: [html]
                properties:
                  html: { type: string }
        default: { $ref: "#/components/responses/Error" }

  /admin/users/{username}/repos:
    parameters:
      - { name: username, in: path, required: true, schema: { type: string } }
    get:
      operationId: adminGetUserRepos
      tags: [admin]
      summary: A user's repository access
      responses:
        "200":
          description: Access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserRepoAccess" }
        default: { $ref: "#/components/responses/Error" }
    put:
      operationId: adminSetUserRepos
      tags: [admin]
      summary: Set a user's repository access
      description: Sets `all_repos` and replaces the list of explicitly granted repositories.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [all_repos, repos]
              properties:
                all_repos: { type: boolean }
                repos: { type: array, items: { type: string }, description: Repository names. Kept even when all_repos is true, so switching back restores them. }
      responses:
        "200":
          description: Updated access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserRepoAccess" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/branches/delete:
    parameters:
      - $ref: "#/components/parameters/RepoName"
    post:
      operationId: deleteBranch
      tags: [code]
      summary: Delete a branch
      description: |
        Needs write access. The default branch, the base or head branch of an open
        pull request, and protected branches that don't allow deletion can't be deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                sha: { type: string, description: Only delete if the branch still points at this commit. }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/compare:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - { name: base, in: query, required: true, schema: { type: string } }
      - { name: head, in: query, required: true, schema: { type: string } }
    get:
      operationId: compareRefs
      tags: [pulls]
      summary: Compare two branches (what a pull request from head into base would contain)
      responses:
        "200":
          description: Comparison
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comparison" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/protections:
    parameters:
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: listProtections
      tags: [pulls]
      summary: List branch protection rules
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/BranchProtection" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createProtection
      tags: [pulls]
      summary: Add a branch protection rule (admins)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchProtectionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchProtection" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/protections/{id}:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      operationId: updateProtection
      tags: [pulls]
      summary: Change a branch protection rule (admins)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchProtectionPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchProtection" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteProtection
      tags: [pulls]
      summary: Remove a branch protection rule (admins)
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Error" }

  /pulls:
    get:
      operationId: listMyPulls
      tags: [pulls]
      summary: Pull requests across all repositories you can access
      parameters:
        - name: filter
          in: query
          description: "`review_requested`: waiting for your review. `authored`: opened by you. `all`: every pull request you can see."
          schema: { type: string, enum: [review_requested, authored, all], default: review_requested }
        - $ref: "#/components/parameters/PullStateParam"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Pull requests, most recently updated first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PullPage" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/pulls:
    parameters:
      - $ref: "#/components/parameters/RepoName"
    get:
      operationId: listPulls
      tags: [pulls]
      summary: List pull requests, most recently updated first
      parameters:
        - $ref: "#/components/parameters/PullStateParam"
        - { name: author, in: query, description: Username of the author., schema: { type: string } }
        - { name: base, in: query, description: Only pull requests into this branch., schema: { type: string } }
        - { name: head, in: query, description: Only pull requests from this branch., schema: { type: string } }
        - { name: q, in: query, description: Case-insensitive substring of the title., schema: { type: string } }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Pull requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PullPage" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createPull
      tags: [pulls]
      summary: Open a pull request (write access)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePullRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PullRequest" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/pulls/{number}:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/PullNumber"
    get:
      operationId: getPull
      tags: [pulls]
      summary: Get a pull request with its mergeability, reviews summary and merge blockers
      responses:
        "200":
          description: Pull request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PullRequest" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updatePull
      tags: [pulls]
      summary: Edit, close, reopen or change the draft state of a pull request
      description: The author or anyone with write access. Changing reviewers needs triage access.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePullRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PullRequest" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/pulls/{number}/commits:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/PullNumber"
    get:
      operationId: listPullCommits
      tags: [pulls]
      summary: Commits in a pull request, oldest first (at most 250)
      responses:
        "200":
          description: Commits
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Commit" } }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/pulls/{number}/files:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/PullNumber"
    get:
      operationId: getPullDiff
      tags: [pulls]
      summary: The pull request's changes (merge base to head)
      responses:
        "200":
          description: Diff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Diff" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/pulls/{number}/timeline:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/PullNumber"
    get:
      operationId: getPullTimeline
      tags: [pulls]
      summary: Conversation timeline, oldest first
      description: |
        Conversation comments, reviews (with the inline comments submitted with
        them), standalone inline comments and events. Replies to inline comments
        aren't separate items; get them from `listPullComments`.
      responses:
        "200":
          description: Timeline
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TimelineItem" } }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/pulls/{number}/comments:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/PullNumber"
    get:
      operationId: listPullComments
      tags: [pulls]
      summary: All comments (conversation and inline, including replies), oldest first
      responses:
        "200":
          description: Comments
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Comment" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createPullComment
      tags: [pulls]
      summary: Comment on a pull request (triage access)
      description: |
        Without `path`, a conversation comment. With `path` and `line`, an inline
        comment on a line of the diff (`side: new` for the head version, `old`
        for the base version). With `reply_to`, a reply in an inline thread.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateComment" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/comments/{id}:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      operationId: updateComment
      tags: [pulls]
      summary: Edit a comment (its author) or resolve an inline thread (triage access)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string }
                resolved: { type: boolean, description: Resolve or unresolve the thread this comment starts. }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Comment" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteComment
      tags: [pulls]
      summary: Delete a comment (its author or an admin)
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/pulls/{number}/reviews:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/PullNumber"
    get:
      operationId: listReviews
      tags: [pulls]
      summary: Reviews, oldest first
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Review" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createReview
      tags: [pulls]
      summary: Submit a review (triage access)
      description: |
        Testers and maintainers can approve or request changes; the author can
        only comment. Inline comments are submitted together with the review.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateReview" }
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/pulls/{number}/reviews/{id}/dismiss:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/PullNumber"
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: dismissReview
      tags: [pulls]
      summary: Dismiss an approval or change request (write access)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        "200":
          description: Dismissed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/pulls/{number}/merge:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/PullNumber"
    post:
      operationId: mergePull
      tags: [pulls]
      summary: Merge a pull request (write access)
      description: |
        Fails with `conflict` (and `details.blockers`) when the pull request
        can't be merged; `getPull` lists the blockers in advance.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MergePullRequest" }
      responses:
        "200":
          description: Merged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PullRequest" }
        default: { $ref: "#/components/responses/Error" }

  /repos/{repo}/pulls/{number}/update-branch:
    parameters:
      - $ref: "#/components/parameters/RepoName"
      - $ref: "#/components/parameters/PullNumber"
    post:
      operationId: updatePullBranch
      tags: [pulls]
      summary: Merge the base branch into the head branch (write access)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                sha: { type: string, description: Only update if the head is still at this commit. }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PullRequest" }
        default: { $ref: "#/components/responses/Error" }

components:
  parameters:
    RepoName:
      name: repo
      in: path
      required: true
      description: Repository name (case-insensitive).
      schema: { type: string }
    RefParam:
      name: ref
      in: query
      description: Branch, tag or commit. Defaults to the default branch.
      schema: { type: string }
    PathParam:
      name: path
      in: query
      description: Path inside the repository; empty for the root.
      schema: { type: string }
    RequiredPathParam:
      name: path
      in: query
      required: true
      description: Path of a file inside the repository.
      schema: { type: string }
    PullNumber:
      name: number
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PullStateParam:
      name: state
      in: query
      schema: { type: string, enum: [open, closed, merged, all], default: open }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: tgp_session
    bearerToken:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
              example: not_found
            message:
              type: string
              description: Human readable message.
            details:
              type: object
              additionalProperties: true
              description: Optional structured details (e.g. per-field validation errors).

    Meta:
      type: object
      required: [version, commit, setup_required, org_name, has_logo]
      properties:
        version: { type: string, example: 1.0.0 }
        commit: { type: string }
        setup_required:
          type: boolean
          description: True until the first admin and org have been configured.
        org_name:
          type: string
          description: Org display name; empty before setup.
        has_logo: { type: boolean }

    Role:
      type: string
      enum: [admin, maintainer, tester]
      description: |
        `admin`: everything, including the admin panel and creating repositories.
        `maintainer`: read/write on granted repositories.
        `tester`: read, issues, comments, reviews and CI re-runs on granted repositories.

    UserSummary:
      type: object
      required: [id, username, display_name, role]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    User:
      type: object
      required: [id, username, display_name, email, role, all_repos, must_change_password, totp_enabled, disabled, created_at]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        display_name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        all_repos:
          type: boolean
          description: Access to every repository. When false, access is limited to explicitly granted repositories. Always true for admins.
        must_change_password: { type: boolean }
        temp_password_expires_at: { type: string, format: date-time, nullable: true }
        totp_enabled: { type: boolean }
        disabled: { type: boolean }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    UserWithTempPassword:
      type: object
      required: [user, temp_password, temp_password_expires_at]
      properties:
        user: { $ref: "#/components/schemas/User" }
        temp_password:
          type: string
          description: Shown only once. The user must change it at first login.
        temp_password_expires_at: { type: string, format: date-time }

    CreateUserRequest:
      type: object
      required: [username, role]
      properties:
        username:
          type: string
          description: Lowercase letters, digits, `-`, `_` and `.`; 1-39 characters, starting with a letter or digit.
        display_name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        all_repos:
          type: boolean
          default: false
          description: Give access to every repository (ignored for admins, who always have it).

    UpdateUserRequest:
      type: object
      properties:
        display_name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        all_repos: { type: boolean }
        disabled:
          type: boolean
          description: Disabled users can't log in and their sessions and tokens stop working.

    Session:
      type: object
      required: [user, auth_method, must_change_password]
      properties:
        user: { $ref: "#/components/schemas/User" }
        auth_method:
          type: string
          enum: [session, token]
        must_change_password: { type: boolean }
        token_scopes:
          type: array
          items: { type: string }
          description: Present when authenticated with a token.

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Username or email.
        password: { type: string }
        totp_code: { type: string }
        recovery_code: { type: string }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password:
          type: string
          description: At least 10 characters.

    PasswordConfirm:
      type: object
      required: [password]
      properties:
        password: { type: string }

    TotpSetup:
      type: object
      required: [secret, otpauth_url]
      properties:
        secret:
          type: string
          description: Base32 secret for manual entry.
        otpauth_url:
          type: string
          description: "`otpauth://` URL to render as a QR code."

    RecoveryCodes:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          items: { type: string }
          description: Single-use codes for logging in without the authenticator. Shown only once.

    TokenScope:
      type: string
      enum: [read, write, admin]

    AccessToken:
      type: object
      required: [id, name, prefix, scopes, created_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        prefix:
          type: string
          description: First characters of the token, to recognise it.
        scopes:
          type: array
          items: { $ref: "#/components/schemas/TokenScope" }
        last_used_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    CreateTokenRequest:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string, example: laptop CLI }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/TokenScope" }
          minItems: 1
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: Omit for a token that never expires.

    CreatedToken:
      type: object
      required: [token, access_token]
      properties:
        token:
          type: string
          description: The secret. Shown only once.
        access_token: { $ref: "#/components/schemas/AccessToken" }

    Org:
      type: object
      required: [name, description, base_url, has_logo]
      properties:
        name: { type: string }
        description: { type: string }
        base_url:
          type: string
          description: Public URL of this server, used in clone URLs and webhooks.
        has_logo: { type: boolean }

    UpdateOrgRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        base_url: { type: string }

    SetupRequest:
      type: object
      required: [setup_token, admin, org]
      properties:
        setup_token:
          type: string
          description: One-time token printed in the tgp-server log on first start.
        admin:
          type: object
          required: [username, password]
          properties:
            username: { type: string }
            display_name: { type: string }
            email: { type: string }
            password: { type: string }
        org:
          type: object
          required: [name]
          properties:
            name: { type: string }
            description: { type: string }
            base_url: { type: string }
        users:
          type: array
          description: Optional extra users; each gets a temporary password.
          items: { $ref: "#/components/schemas/CreateUserRequest" }

    SetupResponse:
      type: object
      required: [admin, users]
      properties:
        admin: { $ref: "#/components/schemas/User" }
        users:
          type: array
          items: { $ref: "#/components/schemas/UserWithTempPassword" }

    AuditEntry:
      type: object
      required: [id, actor, action, target_type, target, ip, details, created_at]
      properties:
        id: { type: integer, format: int64 }
        actor:
          type: string
          description: Username of whoever did it; empty for anonymous actions such as failed logins.
        action:
          type: string
          example: user.create
        target_type: { type: string, example: user }
        target: { type: string }
        ip: { type: string }
        details:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }

    AuditPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        next_before:
          type: integer
          format: int64
          nullable: true
          description: Pass as `before` to get the next page; absent on the last page.

    Permission:
      type: string
      enum: [none, read, triage, write, admin]
      description: |
        `read`: clone and browse. `triage` (testers): plus issues, comments, reviews, CI re-runs.
        `write` (maintainers): plus push and merge. `admin`: plus rename, archive, delete, access.

    Repo:
      type: object
      required: [id, name, description, default_branch, empty, archived, clone_url, permission, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        default_branch: { type: string }
        empty: { type: boolean, description: True until the first push. }
        archived: { type: boolean, description: Archived repositories are read-only. }
        clone_url: { type: string, example: "https://git.example.com/game.git" }
        permission: { $ref: "#/components/schemas/Permission" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        pushed_at: { type: string, format: date-time, nullable: true }

    CreateRepoRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        default_branch: { type: string, default: main }
        auto_init: { type: boolean, default: false, description: Create an initial commit with a README. }

    UpdateRepoRequest:
      type: object
      properties:
        name: { type: string, description: Rename (admins). The old clone URL stops working. }
        description: { type: string }
        default_branch: { type: string, description: Must be an existing branch. }
        archived: { type: boolean, description: Archive or unarchive (admins). }

    RepoAccess:
      type: object
      required: [user, permission, source]
      properties:
        user: { $ref: "#/components/schemas/UserSummary" }
        permission: { $ref: "#/components/schemas/Permission" }
        source:
          type: string
          enum: [admin, all_repos, grant]
          description: Why the user has access.

    UserRepoAccess:
      type: object
      required: [all_repos, repos]
      properties:
        all_repos: { type: boolean }
        repos: { type: array, items: { type: string }, description: Explicitly granted repository names. }

    Ref:
      type: object
      required: [name, commit, subject, author, date]
      properties:
        name: { type: string }
        commit: { type: string, description: Commit id the ref points to (tags are peeled). }
        subject: { type: string, description: First line of the commit message. }
        author: { type: string }
        date: { type: string, format: date-time }
        is_default: { type: boolean }
        protected: { type: boolean, description: A branch protection rule applies (branches only). }

    TreeEntry:
      type: object
      required: [name, path, type, mode, sha, size]
      properties:
        name: { type: string }
        path: { type: string }
        type: { type: string, enum: [file, dir, symlink, submodule] }
        mode: { type: string }
        sha: { type: string }
        size: { type: integer, format: int64 }

    Tree:
      type: object
      required: [ref, commit, path, entries]
      properties:
        ref: { type: string }
        commit: { type: string }
        path: { type: string }
        entries: { type: array, items: { $ref: "#/components/schemas/TreeEntry" } }

    Blob:
      type: object
      required: [ref, commit, path, sha, size, binary, truncated, encoding, content]
      properties:
        ref: { type: string }
        commit: { type: string }
        path: { type: string }
        sha: { type: string }
        size: { type: integer, format: int64 }
        binary: { type: boolean }
        truncated: { type: boolean, description: Content was cut at 1 MiB. }
        encoding: { type: string, enum: [utf-8, base64] }
        content: { type: string }

    Readme:
      type: object
      required: [path, html]
      properties:
        path: { type: string }
        html: { type: string, description: Sanitised HTML. }

    Signature:
      type: object
      required: [name, email, date]
      properties:
        name: { type: string }
        email: { type: string }
        date: { type: string, format: date-time }

    Commit:
      type: object
      required: [sha, parents, author, committer, subject, body]
      properties:
        sha: { type: string }
        parents: { type: array, items: { type: string } }
        author: { $ref: "#/components/schemas/Signature" }
        committer: { $ref: "#/components/schemas/Signature" }
        subject: { type: string }
        body: { type: string }

    CommitPage:
      type: object
      required: [commits, has_more]
      properties:
        commits: { type: array, items: { $ref: "#/components/schemas/Commit" } }
        has_more: { type: boolean }

    DiffLine:
      type: object
      required: [type, content]
      properties:
        type: { type: string, enum: [context, add, del] }
        content: { type: string }
        old_line: { type: integer, description: Line number in the old file (absent for added lines). }
        new_line: { type: integer, description: Line number in the new file (absent for deleted lines). }
        no_newline: { type: boolean }

    DiffHunk:
      type: object
      required: [header, old_start, old_lines, new_start, new_lines, lines]
      properties:
        header: { type: string }
        old_start: { type: integer }
        old_lines: { type: integer }
        new_start: { type: integer }
        new_lines: { type: integer }
        section: { type: string }
        lines: { type: array, items: { $ref: "#/components/schemas/DiffLine" } }

    DiffFile:
      type: object
      required: [old_path, new_path, status, binary, additions, deletions, hunks, truncated]
      properties:
        old_path: { type: string }
        new_path: { type: string }
        status: { type: string, enum: [added, deleted, modified, renamed, copied] }
        old_mode: { type: string }
        new_mode: { type: string }
        binary: { type: boolean }
        additions: { type: integer }
        deletions: { type: integer }
        hunks: { type: array, items: { $ref: "#/components/schemas/DiffHunk" } }
        truncated: { type: boolean, description: Some hunks were omitted because the diff is too large. }

    Diff:
      type: object
      required: [files, additions, deletions, truncated]
      properties:
        files: { type: array, items: { $ref: "#/components/schemas/DiffFile" } }
        additions: { type: integer }
        deletions: { type: integer }
        truncated: { type: boolean }

    CommitDetail:
      type: object
      required: [commit, diff]
      properties:
        commit: { $ref: "#/components/schemas/Commit" }
        diff: { $ref: "#/components/schemas/Diff" }

    BlameRange:
      type: object
      required: [commit, author, email, date, summary, start_line, lines]
      properties:
        commit: { type: string }
        author: { type: string }
        email: { type: string }
        date: { type: string, format: date-time }
        summary: { type: string }
        start_line: { type: integer }
        lines: { type: array, items: { type: string } }

    Blame:
      type: object
      required: [ref, commit, path, ranges]
      properties:
        ref: { type: string }
        commit: { type: string }
        path: { type: string }
        ranges: { type: array, items: { $ref: "#/components/schemas/BlameRange" } }

    PullState:
      type: string
      enum: [open, closed, merged]

    MergeMethod:
      type: string
      enum: [merge, squash, rebase]
      description: |
        `merge`: a merge commit. `squash`: one commit with all the changes.
        `rebase`: each commit replayed onto the base (fast-forward when possible).

    ReviewDecision:
      type: string
      enum: [approved, changes_requested, review_required, none]
      description: |
        `approved`: enough approvals (or at least one when no rule requires any).
        `changes_requested`: someone's latest review requests changes.
        `review_required`: a protection rule needs more approvals. `none`: no reviews yet.

    PullSummary:
      type: object
      required: [number, repo, title, state, draft, author, head_branch, base_branch, comments, review_decision, requested_reviewers, created_at, updated_at]
      properties:
        number: { type: integer, format: int64 }
        repo: { type: string, description: Repository name. }
        title: { type: string }
        state: { $ref: "#/components/schemas/PullState" }
        draft: { type: boolean }
        author: { $ref: "#/components/schemas/UserSummary" }
        head_branch: { type: string }
        base_branch: { type: string }
        comments: { type: integer }
        review_decision: { $ref: "#/components/schemas/ReviewDecision" }
        requested_reviewers: { type: array, items: { $ref: "#/components/schemas/UserSummary" } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        merged_at: { type: string, format: date-time, nullable: true }

    PullPage:
      type: object
      required: [pulls, total]
      properties:
        pulls: { type: array, items: { $ref: "#/components/schemas/PullSummary" } }
        total: { type: integer, description: Total matching, across all pages. }

    PullBranch:
      type: object
      required: [branch, sha, exists]
      properties:
        branch: { type: string }
        sha: { type: string, description: Current tip (for a merged pull request, the commit it was merged at). }
        exists: { type: boolean, description: The branch still exists. }

    MergeBlocker:
      type: object
      required: [code, message, bypassable]
      properties:
        code:
          type: string
          enum: [closed, merged, draft, head_missing, base_missing, conflict, permission, approvals, changes_requested, behind]
        message: { type: string }
        bypassable:
          type: boolean
          description: An admin may merge anyway with `bypass_protection` (the rule allows admins to bypass it).

    ReviewerState:
      type: object
      required: [user, state, stale]
      properties:
        user: { $ref: "#/components/schemas/UserSummary" }
        state: { type: string, enum: [approved, changes_requested, commented, dismissed, requested] }
        commit_sha: { type: string }
        stale: { type: boolean, description: Reviewed an older head commit. }

    PullRequest:
      type: object
      required: [number, repo, title, body, body_html, state, draft, author, head, base, merge_base, commits, additions, deletions, changed_files, comments, mergeable, conflict_files, review_decision, reviewers, requested_reviewers, blockers, can_merge, viewer_permission, created_at, updated_at]
      properties:
        number: { type: integer, format: int64 }
        repo: { type: string }
        title: { type: string }
        body: { type: string }
        body_html: { type: string, description: Rendered, sanitised HTML of the body. }
        state: { $ref: "#/components/schemas/PullState" }
        draft: { type: boolean }
        author: { $ref: "#/components/schemas/UserSummary" }
        head: { $ref: "#/components/schemas/PullBranch" }
        base: { $ref: "#/components/schemas/PullBranch" }
        merge_base: { type: string, description: Common ancestor of base and head. }
        commits: { type: integer }
        additions: { type: integer }
        deletions: { type: integer }
        changed_files: { type: integer }
        comments: { type: integer }
        mergeable:
          type: string
          enum: [clean, conflict, unknown]
          description: Whether head merges into base without conflicts. `unknown` for closed pull requests or a missing head.
        conflict_files: { type: array, items: { type: string } }
        behind_by: { type: integer, description: Base commits not in head. }
        review_decision: { $ref: "#/components/schemas/ReviewDecision" }
        reviewers:
          type: array
          description: Each reviewer's latest review state, plus requested reviewers who haven't reviewed.
          items: { $ref: "#/components/schemas/ReviewerState" }
        requested_reviewers: { type: array, items: { $ref: "#/components/schemas/UserSummary" } }
        protection:
          allOf: [{ $ref: "#/components/schemas/BranchProtection" }]
          nullable: true
          description: The protection rule applying to the base branch, if any.
        blockers:
          type: array
          description: Why you can't merge right now; empty when you can.
          items: { $ref: "#/components/schemas/MergeBlocker" }
        can_merge: { type: boolean, description: You can merge now (blockers is empty). }
        viewer_permission: { $ref: "#/components/schemas/Permission" }
        merged_by:
          allOf: [{ $ref: "#/components/schemas/UserSummary" }]
          nullable: true
        merge_commit: { type: string, nullable: true }
        merge_method: { type: string, nullable: true, description: "merge, squash, rebase, or manual (the head was pushed to the base outside tgp)." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }
        merged_at: { type: string, format: date-time, nullable: true }

    CreatePullRequest:
      type: object
      required: [title, head]
      properties:
        title: { type: string }
        body: { type: string }
        head: { type: string, description: Branch with the changes. }
        base: { type: string, description: Branch to merge into; defaults to the default branch. }
        draft: { type: boolean, default: false }
        reviewers: { type: array, items: { type: string }, description: Usernames to request reviews from. }

    UpdatePullRequest:
      type: object
      properties:
        title: { type: string }
        body: { type: string }
        base: { type: string, description: Change the base branch. }
        state: { type: string, enum: [open, closed], description: Close or reopen. }
        draft: { type: boolean, description: false marks the pull request ready for review. }
        reviewers: { type: array, items: { type: string }, description: Replaces the requested reviewers. }

    MergePullRequest:
      type: object
      properties:
        method: { $ref: "#/components/schemas/MergeMethod" }
        title: { type: string, description: Subject of the merge or squash commit. }
        message: { type: string, description: Body of the merge or squash commit. }
        sha: { type: string, description: Only merge if the head is still at this commit. }
        delete_branch: { type: boolean, default: false, description: Delete the head branch after merging. }
        bypass_protection:
          type: boolean
          default: false
          description: Admins only, when the rule allows it; merge despite missing approvals, change requests or an out-of-date branch.

    Comment:
      type: object
      required: [id, author, body, body_html, created_at, updated_at, edited]
      properties:
        id: { type: integer, format: int64 }
        author: { $ref: "#/components/schemas/UserSummary" }
        body: { type: string }
        body_html: { type: string }
        review_id: { type: integer, format: int64, nullable: true }
        reply_to: { type: integer, format: int64, nullable: true, description: The thread's first comment, for replies. }
        path: { type: string, description: File, for inline comments. }
        line: { type: integer, description: Line number on `side`, for inline comments. }
        side: { type: string, enum: [new, old] }
        commit_sha: { type: string, description: Head commit the inline comment was made on. }
        diff_hunk: { type: string, description: Diff lines leading up to the commented line, for context. }
        outdated: { type: boolean, description: The file changed since the comment was made, so the line may have moved. }
        resolved: { type: boolean }
        resolved_by:
          allOf: [{ $ref: "#/components/schemas/UserSummary" }]
          nullable: true
        edited: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateComment:
      type: object
      required: [body]
      properties:
        body: { type: string }
        path: { type: string }
        line: { type: integer, minimum: 1 }
        side: { type: string, enum: [new, old], default: new }
        reply_to: { type: integer, format: int64 }

    InlineCommentInput:
      type: object
      required: [path, line, body]
      properties:
        path: { type: string }
        line: { type: integer, minimum: 1 }
        side: { type: string, enum: [new, old], default: new }
        body: { type: string }

    Review:
      type: object
      required: [id, author, state, body, body_html, commit_sha, stale, dismissed, comments, created_at]
      properties:
        id: { type: integer, format: int64 }
        author: { $ref: "#/components/schemas/UserSummary" }
        state: { type: string, enum: [approved, changes_requested, commented] }
        body: { type: string }
        body_html: { type: string }
        commit_sha: { type: string }
        stale: { type: boolean, description: Made on an older head commit. }
        dismissed: { type: boolean }
        dismissed_by:
          allOf: [{ $ref: "#/components/schemas/UserSummary" }]
          nullable: true
        dismiss_message: { type: string }
        comments: { type: array, items: { $ref: "#/components/schemas/Comment" }, description: Inline comments submitted with the review. }
        created_at: { type: string, format: date-time }

    CreateReview:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [approve, request_changes, comment] }
        body: { type: string, description: Required when requesting changes or commenting without inline comments. }
        commit_sha: { type: string, description: Head commit you reviewed; rejected if the head has moved since. }
        comments: { type: array, items: { $ref: "#/components/schemas/InlineCommentInput" } }

    PullEvent:
      type: object
      required: [id, type, data, created_at]
      properties:
        id: { type: integer, format: int64 }
        type:
          type: string
          enum: [closed, reopened, merged, pushed, base_changed, title_changed, ready_for_review, converted_to_draft, review_requested, review_request_removed, review_dismissed, head_deleted, head_restored, branch_deleted, branch_updated]
        actor:
          allOf: [{ $ref: "#/components/schemas/UserSummary" }]
          nullable: true
        data:
          type: object
          additionalProperties: true
          description: |
            Type-specific: `pushed` {before, after, commits, forced}; `base_changed`
            and `title_changed` {from, to}; `merged` {commit, method}; `review_requested`
            and `review_request_removed` {reviewer}; `review_dismissed` {reviewer, message};
            `branch_deleted` {branch}; `branch_updated` {commit}.
        created_at: { type: string, format: date-time }

    TimelineItem:
      type: object
      required: [kind, created_at]
      properties:
        kind: { type: string, enum: [comment, review, inline_comment, event] }
        created_at: { type: string, format: date-time }
        comment: { $ref: "#/components/schemas/Comment" }
        review: { $ref: "#/components/schemas/Review" }
        event: { $ref: "#/components/schemas/PullEvent" }

    Comparison:
      type: object
      required: [base, head, base_sha, head_sha, merge_base, ahead_by, behind_by, commits, diff, mergeable, conflict_files]
      properties:
        base: { type: string }
        head: { type: string }
        base_sha: { type: string }
        head_sha: { type: string }
        merge_base: { type: string }
        ahead_by: { type: integer }
        behind_by: { type: integer }
        commits: { type: array, items: { $ref: "#/components/schemas/Commit" }, description: Oldest first, at most 250. }
        diff: { $ref: "#/components/schemas/Diff" }
        mergeable: { type: string, enum: [clean, conflict] }
        conflict_files: { type: array, items: { type: string } }
        existing_pull: { type: integer, format: int64, nullable: true, description: An open pull request from head into base. }

    BranchProtection:
      type: object
      required: [id, pattern, require_pull_request, required_approvals, dismiss_stale_approvals, require_up_to_date, block_force_push, allow_deletion, admins_bypass, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        pattern: { type: string, description: "Branch name or glob, e.g. `main` or `release/*`." }
        require_pull_request: { type: boolean, description: No direct pushes; changes land through pull requests. }
        required_approvals: { type: integer, description: Approvals needed to merge (from anyone but the author). }
        dismiss_stale_approvals: { type: boolean, description: Approvals of an older head commit don't count. }
        require_up_to_date: { type: boolean, description: The head must contain the latest base commit before merging. }
        block_force_push: { type: boolean }
        allow_deletion: { type: boolean }
        admins_bypass: { type: boolean, description: Admins may push directly and merge despite unmet requirements. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BranchProtectionInput:
      type: object
      required: [pattern]
      properties:
        pattern: { type: string }
        require_pull_request: { type: boolean, default: true }
        required_approvals: { type: integer, minimum: 0, maximum: 10, default: 1 }
        dismiss_stale_approvals: { type: boolean, default: true }
        require_up_to_date: { type: boolean, default: false }
        block_force_push: { type: boolean, default: true }
        allow_deletion: { type: boolean, default: false }
        admins_bypass: { type: boolean, default: false }

    BranchProtectionPatch:
      type: object
      properties:
        pattern: { type: string }
        require_pull_request: { type: boolean }
        required_approvals: { type: integer, minimum: 0, maximum: 10 }
        dismiss_stale_approvals: { type: boolean }
        require_up_to_date: { type: boolean }
        block_force_push: { type: boolean }
        allow_deletion: { type: boolean }
        admins_bypass: { type: boolean }
